<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Smart Campus - Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #f59e0b;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .sidebar-transition { transition: all 0.3s ease; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .image-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px dashed #f59e0b;
        }
        .stat-card { transition: all 0.3s ease; cursor: default; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .dark { background-color: #1a1a2e; }
        .dark .bg-white { background-color: #1e1e3a; }
        .dark .text-gray-800 { color: #e0e0e0; }
        .dark .text-gray-600 { color: #b0b0b0; }
        .dark .text-gray-500 { color: #909090; }
        .dark .bg-gray-50 { background-color: #252545; }
        .dark .bg-gray-100 { background-color: #2a2a4a; }
        .dark .shadow-md { box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .dark .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.4); }
        .dark .border-gray-200 { border-color: #333355; }
        .dark .bg-gray-700 { background-color: #3a3a5a; }
        .dark .bg-gray-800 { background-color: #2a2a4a; }
        .dark .bg-gray-900 { background-color: #1a1a2e; }
        .dark .bg-yellow-50 { background-color: #3a3a1a; }
        .dark .text-yellow-600 { color: #fbbf24; }
        .dark .bg-yellow-100 { background-color: #3a3a1a; }
        .dark .border-yellow-500 { border-color: #f59e0b; }
        .lf-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #92400e 100%); }
        .lf-button { background: linear-gradient(to right, #f59e0b, #d97706); }
        .lf-button:hover { background: linear-gradient(to right, #d97706, #92400e); }
        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }
        .item-card {
            transition: all 0.3s ease;
        }
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .sidebar-stats .stat-item {
            transition: all 0.2s ease;
        }
        .sidebar-stats .stat-item:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE_URL = '/api';

    const api = axios.create({
        baseURL: API_BASE_URL,
        headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) {
            config.headers.Authorization = `Bearer ${token}`;
        }
        return config;
    });

    api.interceptors.response.use(
        response => response,
        error => {
            if (error.response?.status === 401) {
                localStorage.clear();
                window.location.href = '/index-lostfound.html';
            }
            return Promise.reject(error);
        }
    );

    // ==================== LOST & FOUND LOGIN PAGE ====================
    function LoginPage({ onSwitchToRegister }) {
        const [loginId, setLoginId] = useState('');
        const [email, setEmail] = useState('');
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [loading, setLoading] = useState(false);
        const [otpSent, setOtpSent] = useState(false);
        const [otpTimer, setOtpTimer] = useState(0);
        const [resendDisabled, setResendDisabled] = useState(false);
        const [otpInputs, setOtpInputs] = useState(['', '', '', '', '', '']);

        useEffect(() => {
            let interval;
            if (otpTimer > 0) {
                interval = setInterval(() => { setOtpTimer(prev => prev - 1); }, 1000);
            } else {
                setResendDisabled(false);
            }
            return () => clearInterval(interval);
        }, [otpTimer]);

        const handleSendOtp = async (e) => {
            e.preventDefault();
            setError(''); setSuccess(''); setLoading(true);
            if (!loginId || loginId.trim() === '') {
                setError('Please enter your Login ID');
                setLoading(false);
                return;
            }
            try {
                const response = await api.post('/auth/send-otp', { loginId });
                setSuccess('OTP sent successfully to your registered email');
                setOtpSent(true);
                setOtpTimer(60);
                setResendDisabled(true);
                setError('');
                setEmail(response.data.email);
                console.log('📧 OTP for Login ID ' + loginId + ': ' + response.data.otp);
            } catch (err) {
                setError(err.response?.data?.message || 'Failed to send OTP');
            } finally {
                setLoading(false);
            }
        };

        const handleVerifyOtp = async (e) => {
            e.preventDefault();
            setError(''); setSuccess(''); setLoading(true);
            const fullOtp = otpInputs.join('');
            if (fullOtp.length !== 6) {
                setError('Please enter a valid 6-digit OTP');
                setLoading(false);
                return;
            }
            try {
                const response = await api.post('/auth/login', { loginId, otp: fullOtp });
                localStorage.setItem('token', response.data.token);
                localStorage.setItem('userId', response.data.userId);
                localStorage.setItem('loginId', response.data.loginId);
                localStorage.setItem('name', response.data.name);
                localStorage.setItem('email', response.data.email);
                localStorage.setItem('role', response.data.role);
                window.location.reload();
            } catch (err) {
                setError(err.response?.data?.message || 'Invalid or expired OTP');
            } finally {
                setLoading(false);
            }
        };

        const handleOtpInputChange = (index, value) => {
            if (value.length > 1) return;
            const newOtpInputs = [...otpInputs];
            newOtpInputs[index] = value;
            setOtpInputs(newOtpInputs);
            if (value && index < 5) {
                document.getElementById(`otp-input-${index + 1}`)?.focus();
            }
        };

        const handleKeyDown = (index, e) => {
            if (e.key === 'Backspace' && !otpInputs[index] && index > 0) {
                document.getElementById(`otp-input-${index - 1}`)?.focus();
            }
        };

        const handleQuickLogin = (id) => {
            setLoginId(id);
            setTimeout(() => {
                const form = document.querySelector('#loginForm');
                if (form) form.dispatchEvent(new Event('submit'));
            }, 300);
        };

        return (
            <div className="min-h-screen flex items-center justify-center p-4 lf-gradient">
                <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
                    {/* Header with Lost & Found Theme */}
                    <div className="text-center mb-8">
                        <div className="w-20 h-20 bg-gradient-to-br from-yellow-500 to-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <span className="text-4xl">🔍</span>
                        </div>
                        <h1 className="text-3xl font-bold text-gray-800">Lost & Found</h1>
                        <p className="text-gray-500 text-sm mt-1">Campus Lost Items Portal</p>
                        <p className="text-xs text-yellow-600 mt-2">🔐 Login with your Campus ID</p>
                    </div>

                    {error && (
                        <div className="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg mb-4 flex items-start gap-3">
                            <span className="text-xl">⚠️</span>
                            <div><p className="font-medium">Error</p><p className="text-sm">{error}</p></div>
                            <button onClick={() => setError('')} className="ml-auto text-red-700 font-bold">×</button>
                        </div>
                    )}

                    {success && (
                        <div className="bg-green-50 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded-lg mb-4 flex items-start gap-3">
                            <span className="text-xl">✅</span>
                            <div><p className="font-medium">Success</p><p className="text-sm">{success}</p></div>
                            <button onClick={() => setSuccess('')} className="ml-auto text-green-700 font-bold">×</button>
                        </div>
                    )}

                    {!otpSent ? (
                        <form id="loginForm" onSubmit={handleSendOtp}>
                            <div className="mb-4">
                                <label className="block text-gray-700 text-sm font-bold mb-2">Login ID</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-3 text-yellow-500">🆔</span>
                                    <input type="text" value={loginId} onChange={(e) => setLoginId(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 border-2 border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition"
                                        placeholder="Enter your Login ID" required />
                                </div>
                            </div>

                            <div className="mb-4">
                                <p className="text-xs text-gray-500 text-center mb-2">Quick Login</p>
                                <div className="grid grid-cols-1 gap-2">
                                    <button type="button" onClick={() => handleQuickLogin('1001')}
                                        className="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-3 rounded-lg transition text-sm border-2 border-blue-200 hover:border-blue-400">
                                        🎓 Student Quick Login (1001)
                                    </button>
                                    <p className="text-xs text-gray-400 text-center">Faculty and Admin can also login with their ID</p>
                                </div>
                            </div>

                            <button type="submit" disabled={loading}
                                    className="w-full lf-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50 transform hover:scale-[1.02]">
                                {loading ? (<span className="flex items-center justify-center gap-2"><span className="spinner w-5 h-5"></span>Sending OTP...</span>) : ('📧 Send OTP')}
                            </button>

                            <div className="mt-4 text-center">
                                <button type="button" onClick={onSwitchToRegister} className="text-yellow-600 hover:text-yellow-800 text-sm font-medium">
                                    Don't have an account? Register here
                                </button>
                            </div>
                        </form>
                    ) : (
                        <form onSubmit={handleVerifyOtp}>
                            <div className="mb-2 text-center">
                                <p className="text-sm text-gray-600">OTP sent to your registered email</p>
                                {email && <p className="text-xs text-gray-500">({email})</p>}
                                <p className="text-xs mt-1 font-medium text-yellow-600">
                                    🔍 Login ID: <strong>{loginId}</strong>
                                </p>
                            </div>

                            <div className="mb-4">
                                <label className="block text-gray-700 text-sm font-bold mb-4 text-center">Enter 6-Digit OTP</label>
                                <div className="flex justify-center gap-2">
                                    {otpInputs.map((value, index) => (
                                        <input key={index} id={`otp-input-${index}`} type="text" maxLength="1" value={value}
                                            onChange={(e) => handleOtpInputChange(index, e.target.value)}
                                            onKeyDown={(e) => handleKeyDown(index, e)}
                                            className="w-12 h-14 text-center text-2xl font-bold border-2 border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition"
                                            autoFocus={index === 0} />
                                    ))}
                                </div>
                            </div>

                            <button type="submit" disabled={loading}
                                    className="w-full lf-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50 transform hover:scale-[1.02]">
                                {loading ? (<span className="flex items-center justify-center gap-2"><span className="spinner w-5 h-5"></span>Verifying...</span>) : ('🔐 Verify & Login')}
                            </button>

                            <div className="mt-4 text-center">
                                <button type="button" onClick={() => { setOtpSent(false); setOtpInputs(['', '', '', '', '', '']); }} className="text-gray-500 hover:text-gray-700 text-sm">← Back to Login ID</button>
                                <span className="mx-2 text-gray-300">|</span>
                                <button type="button" onClick={handleSendOtp} disabled={resendDisabled} className={`text-sm ${resendDisabled ? 'text-gray-400 cursor-not-allowed' : 'text-yellow-600 hover:text-yellow-800'}`}>
                                    {resendDisabled ? `Resend in ${otpTimer}s` : 'Resend OTP'}
                                </button>
                            </div>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    // ==================== REGISTER PAGE ====================
    function RegisterPage({ onSwitchToLogin }) {
        const [name, setName] = useState('');
        const [email, setEmail] = useState('');
        const [role, setRole] = useState('STUDENT');
        const [phoneNumber, setPhoneNumber] = useState('');
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [loading, setLoading] = useState(false);

        const handleRegister = async (e) => {
            e.preventDefault();
            setError(''); setSuccess(''); setLoading(true);
            const defaultPassword = 'user123';
            try {
                await api.post('/auth/register', { name, email, password: defaultPassword, role, phoneNumber });
                setSuccess('Registration successful! Please login with OTP.');
                setTimeout(() => onSwitchToLogin(), 2000);
            } catch (err) {
                setError(err.response?.data?.message || 'Registration failed. Please try again.');
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="min-h-screen flex items-center justify-center p-4 lf-gradient">
                <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
                    <div className="text-center mb-8">
                        <div className="w-20 h-20 bg-gradient-to-br from-yellow-500 to-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <span className="text-4xl">🔍</span>
                        </div>
                        <h1 className="text-3xl font-bold text-gray-800">Join Lost & Found</h1>
                        <p className="text-gray-500 text-sm mt-1">Create your account</p>
                    </div>
                    {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4">{error}</div>}
                    {success && <div className="bg-green-100 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded mb-4">{success}</div>}
                    <form onSubmit={handleRegister}>
                        <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Full Name *</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition" placeholder="John Doe" required /></div>
                        <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Email *</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition" placeholder="your@email.com" required /></div>
                        <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Phone Number</label><input type="tel" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition" placeholder="10-digit phone number" /></div>
                        <div className="mb-6"><label className="block text-gray-700 text-sm font-bold mb-2">Role</label><select value={role} onChange={(e) => setRole(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 transition"><option value="STUDENT">🎓 Student</option><option value="FACULTY">👨‍🏫 Faculty</option><option value="ADMIN">👨‍💼 Admin</option></select></div>
                        <div className="mb-4 p-3 bg-yellow-50 rounded-lg border border-yellow-200">
                            <p className="text-sm text-gray-600">📌 You will login using OTP sent to your email. No password needed!</p>
                        </div>
                        <button type="submit" disabled={loading} className="w-full lf-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50 transform hover:scale-[1.02]">{loading ? 'Registering...' : '🚀 Create Account'}</button>
                    </form>
                    <div className="mt-6 text-center"><p className="text-gray-600">Already have an account? <button onClick={onSwitchToLogin} className="text-yellow-600 font-bold hover:underline">Login here</button></p></div>
                </div>
            </div>
        );
    }

    // ==================== LOST & FOUND DASHBOARD ====================
    function LostAndFoundDashboard({ isDarkMode = false, sidebarStats }) {
        const [items, setItems] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [showReportModal, setShowReportModal] = useState(false);
        const [selectedStatus, setSelectedStatus] = useState('ALL');
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedItem, setSelectedItem] = useState(null);
        const [showMatches, setShowMatches] = useState(false);
        const [matches, setMatches] = useState([]);
        const [selectedImage, setSelectedImage] = useState(null);
        const [imagePreview, setImagePreview] = useState(null);
        const [imageError, setImageError] = useState({});
        const role = localStorage.getItem('role');
        const userName = localStorage.getItem('name') || 'User';
        const userId = localStorage.getItem('userId');

        const getCardBg = () => isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white';
        const getTextColor = () => isDarkMode ? 'text-white' : 'text-gray-800';
        const getSubTextColor = () => isDarkMode ? 'text-gray-400' : 'text-gray-500';
        const getBgColor = () => isDarkMode ? 'bg-gray-900' : 'bg-gray-100';

        const [formData, setFormData] = useState({
            title: '',
            description: '',
            category: '',
            location: '',
            date: new Date().toISOString().split('T')[0],
            status: 'LOST',
            contactInfo: ''
        });

        const categories = ['Electronics', 'Books', 'Clothing', 'Accessories', 'Documents', 'Others'];

        useEffect(() => { fetchItems(); }, [selectedStatus]);

        const fetchItems = async () => {
            setLoading(true);
            setError('');
            try {
                let url = '/lost-found/all';
                if (selectedStatus !== 'ALL') {
                    url = `/lost-found/status/${selectedStatus}`;
                }
                const response = await api.get(url);
                console.log('📦 Items fetched:', response.data);
                setItems(response.data || []);
            } catch (err) {
                setError('Failed to load items');
                console.error(err);
            }
            setLoading(false);
        };

        const handleImageChange = (e) => {
            const file = e.target.files[0];
            if (file) {
                setSelectedImage(file);
                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                };
                reader.readAsDataURL(file);
            }
        };

        const handleReportItem = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            setSuccess('');

            try {
                const formDataToSend = new FormData();
                formDataToSend.append('item', new Blob([JSON.stringify({
                    title: formData.title,
                    description: formData.description,
                    category: formData.category,
                    location: formData.location,
                    date: formData.date,
                    status: formData.status,
                    contactInfo: formData.contactInfo
                })], { type: 'application/json' }));

                if (selectedImage) {
                    formDataToSend.append('image', selectedImage);
                    console.log('📸 Image selected:', selectedImage.name);
                }

                const response = await api.post('/lost-found/report', formDataToSend, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                });

                console.log('✅ Item reported:', response.data);
                setSuccess('Item reported successfully!');
                setShowReportModal(false);
                setFormData({ title: '', description: '', category: '', location: '', date: new Date().toISOString().split('T')[0], status: 'LOST', contactInfo: '' });
                setSelectedImage(null);
                setImagePreview(null);
                fetchItems();
            } catch (err) {
                console.error('❌ Error reporting item:', err);
                setError(err.response?.data?.error || 'Failed to report item');
            } finally {
                setLoading(false);
            }
        };

        const handleClaimItem = async (id) => {
            if (!confirm('Are you sure you want to claim this item?')) return;
            setLoading(true);
            try {
                await api.put(`/lost-found/${id}/claim`);
                setSuccess('Item claimed successfully!');
                fetchItems();
            } catch (err) {
                setError(err.response?.data?.error || 'Failed to claim item');
            } finally {
                setLoading(false);
            }
        };

        const handleFindMatches = async (id) => {
            try {
                console.log('🔍 Finding matches for item ID:', id);
                const response = await api.get(`/lost-found/${id}/matches`);
                console.log('📊 Matches response:', response.data);

                if (response.data && response.data.length > 0) {
                    setMatches(response.data);
                } else {
                    setMatches([]);
                }
                setSelectedItem(id);
                setShowMatches(true);
            } catch (err) {
                console.error('❌ Error finding matches:', err);
                setError('Failed to find matches: ' + (err.response?.data?.message || err.message));
                setMatches([]);
                setShowMatches(true);
            }
        };

        const handleDeleteItem = async (id) => {
            if (!confirm('Are you sure you want to delete this item?')) return;
            setLoading(true);
            try {
                await api.delete(`/lost-found/${id}`);
                setSuccess('Item deleted successfully!');
                fetchItems();
            } catch (err) {
                setError(err.response?.data?.error || 'Failed to delete item');
            } finally {
                setLoading(false);
            }
        };

        const handleImageError = (itemId) => {
            setImageError(prev => ({ ...prev, [itemId]: true }));
        };

        const filteredItems = items.filter(item =>
            item.title?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.category?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.location?.toLowerCase().includes(searchTerm.toLowerCase())
        );

        const getStatusBadge = (status) => {
            if (status === 'LOST') return 'bg-red-100 text-red-700 border-red-300 dark:bg-red-900/30 dark:text-red-400';
            if (status === 'FOUND') return 'bg-green-100 text-green-700 border-green-300 dark:bg-green-900/30 dark:text-green-400';
            return 'bg-blue-100 text-blue-700 border-blue-300 dark:bg-blue-900/30 dark:text-blue-400';
        };

        const canDelete = (item) => {
            return item.reportedById == userId || role === 'ADMIN';
        };

        const totalItems = items.length;
        const lostItems = items.filter(i => i.status === 'LOST').length;
        const foundItems = items.filter(i => i.status === 'FOUND').length;
        const claimedItems = items.filter(i => i.status === 'CLAIMED').length;

        // Update sidebar stats
        useEffect(() => {
            if (sidebarStats) {
                sidebarStats({ totalItems, lostItems, foundItems, claimedItems });
            }
        }, [totalItems, lostItems, foundItems, claimedItems]);

        return (
            <div className={`min-h-screen p-6 ${getBgColor()}`}>
                {/* Welcome Banner */}
                <div className="bg-gradient-to-r from-yellow-500 to-amber-600 rounded-2xl p-6 text-white mb-6 shadow-lg">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold">👋 Welcome, {userName}!</h2>
                            <p className="text-white/80 text-sm">Report lost or found items on campus</p>
                        </div>
                        <button onClick={() => setShowReportModal(true)} className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 backdrop-blur-sm">
                            <span className="text-xl">+</span> Report Item
                        </button>
                    </div>
                </div>

                {/* Stats Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div className={`${getCardBg()} rounded-xl shadow-sm p-4 border-l-4 border-yellow-500`}>
                        <p className={`text-xs ${getSubTextColor()}`}>Total</p>
                        <p className={`text-2xl font-bold ${getTextColor()}`}>{loading ? '...' : totalItems}</p>
                    </div>
                    <div className={`${getCardBg()} rounded-xl shadow-sm p-4 border-l-4 border-red-500`}>
                        <p className={`text-xs ${getSubTextColor()}`}>Lost</p>
                        <p className="text-2xl font-bold text-red-600">{loading ? '...' : lostItems}</p>
                    </div>
                    <div className={`${getCardBg()} rounded-xl shadow-sm p-4 border-l-4 border-green-500`}>
                        <p className={`text-xs ${getSubTextColor()}`}>Found</p>
                        <p className="text-2xl font-bold text-green-600">{loading ? '...' : foundItems}</p>
                    </div>
                    <div className={`${getCardBg()} rounded-xl shadow-sm p-4 border-l-4 border-blue-500`}>
                        <p className={`text-xs ${getSubTextColor()}`}>Claimed</p>
                        <p className="text-2xl font-bold text-blue-600">{loading ? '...' : claimedItems}</p>
                    </div>
                </div>

                {/* Search & Filter */}
                <div className="flex flex-wrap gap-3 mb-6">
                    <div className="flex-1 min-w-[200px]">
                        <input
                            type="text"
                            placeholder="🔍 Search items..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                        />
                    </div>
                    <select
                        value={selectedStatus}
                        onChange={(e) => setSelectedStatus(e.target.value)}
                        className={`px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                    >
                        <option value="ALL">All Items</option>
                        <option value="LOST">Lost</option>
                        <option value="FOUND">Found</option>
                        <option value="CLAIMED">Claimed</option>
                    </select>
                </div>

                {/* Messages */}
                {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4 flex justify-between"><span>{error}</span><button onClick={() => setError('')} className="text-red-700 font-bold">×</button></div>}
                {success && <div className="bg-green-100 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded mb-4 flex justify-between"><span>{success}</span><button onClick={() => setSuccess('')} className="text-green-700 font-bold">×</button></div>}

                {/* Items Grid */}
                {loading ? <div className="flex justify-center items-center py-12"><div className="spinner"></div></div> :
                filteredItems.length === 0 ? <div className={`text-center py-12 ${getCardBg()} rounded-xl shadow-sm`}><div className="text-5xl mb-3">🔍</div><p className={`text-lg ${getSubTextColor()}`}>No items found</p><button onClick={() => setShowReportModal(true)} className="mt-3 text-yellow-600 hover:text-yellow-700 font-medium">+ Report an item</button></div> :
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredItems.map((item) => (
                        <div key={item.id} className={`${getCardBg()} rounded-xl shadow-sm hover:shadow-md transition border-l-4 ${item.status === 'LOST' ? 'border-red-500' : item.status === 'FOUND' ? 'border-green-500' : 'border-blue-500'}`}>
                            {item.imageUrl && !imageError[item.id] && (
                                <div className="h-48 overflow-hidden rounded-t-xl">
                                    <img src={item.imageUrl} alt={item.title} className="w-full h-full object-cover" onError={() => handleImageError(item.id)} />
                                </div>
                            )}
                            {item.imageUrl && imageError[item.id] && (
                                <div className="h-48 bg-gray-200 dark:bg-gray-700 flex items-center justify-center rounded-t-xl">
                                    <span className="text-4xl">🖼️</span>
                                    <span className="text-sm text-gray-500 ml-2">Image not available</span>
                                </div>
                            )}
                            <div className="p-4">
                                <div className="flex justify-between items-start">
                                    <h3 className={`font-bold text-lg ${getTextColor()}`}>{item.title}</h3>
                                    <span className={`px-2 py-1 rounded-full text-xs font-medium border ${getStatusBadge(item.status)}`}>{item.status}</span>
                                </div>
                                {item.category && <p className={`text-sm ${getSubTextColor()} mt-1`}>📂 {item.category}</p>}
                                <p className={`text-sm ${getSubTextColor()} mt-1`}>📍 {item.location}</p>
                                <p className={`text-xs ${getSubTextColor()} mt-1`}>📅 {item.date ? new Date(item.date).toLocaleDateString() : 'N/A'}</p>
                                {item.contactInfo && <p className={`text-xs ${getSubTextColor()} mt-1`}>📞 {item.contactInfo}</p>}
                                <p className={`text-xs ${getSubTextColor()} mt-1`}>👤 Reported by: {item.reportedByName}</p>
                                <div className="flex flex-wrap gap-2 mt-3">
                                    {item.status === 'FOUND' && (
                                        <button onClick={() => handleClaimItem(item.id)} className="bg-green-600 text-white px-3 py-1 rounded-lg hover:bg-green-700 transition text-sm">Claim</button>
                                    )}
                                    <button onClick={() => handleFindMatches(item.id)} className="bg-purple-600 text-white px-3 py-1 rounded-lg hover:bg-purple-700 transition text-sm">Find Matches</button>
                                    {canDelete(item) && (
                                        <button onClick={() => handleDeleteItem(item.id)} className="bg-red-600 text-white px-3 py-1 rounded-lg hover:bg-red-700 transition text-sm">Delete</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>}

                {/* Report Modal */}
                {showReportModal && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 fade-in modal-overlay">
                        <div className={`${getCardBg()} rounded-xl shadow-2xl p-8 w-full max-w-md max-h-[90vh] overflow-y-auto`}>
                            <div className="flex justify-between items-center mb-6">
                                <h2 className={`text-2xl font-bold ${getTextColor()}`}>📝 Report Item</h2>
                                <button onClick={() => setShowReportModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                            </div>
                            <form onSubmit={handleReportItem} encType="multipart/form-data">
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Title *</label>
                                    <input type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} required />
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Description</label>
                                    <textarea value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} rows="3" className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} />
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Category</label>
                                    <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}>
                                        <option value="">Select Category</option>
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Location *</label>
                                    <input type="text" value={formData.location} onChange={(e) => setFormData({...formData, location: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} required />
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Date</label>
                                    <input type="date" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} />
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Status</label>
                                    <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}>
                                        <option value="LOST">Lost</option>
                                        <option value="FOUND">Found</option>
                                    </select>
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Contact Info</label>
                                    <input type="text" value={formData.contactInfo} onChange={(e) => setFormData({...formData, contactInfo: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} placeholder="Email or phone number" />
                                </div>
                                <div className="mb-4">
                                    <label className={`block ${getTextColor()} font-bold mb-2`}>Image</label>
                                    <input type="file" accept="image/*" onChange={handleImageChange} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} />
                                    {imagePreview && (
                                        <div className="mt-2">
                                            <img src={imagePreview} alt="Preview" className="image-preview" />
                                        </div>
                                    )}
                                </div>
                                <button type="submit" disabled={loading} className="w-full lf-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50">{loading ? 'Submitting...' : 'Submit Report'}</button>
                            </form>
                        </div>
                    </div>
                )}

                {/* Matches Modal */}
                {showMatches && selectedItem && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 fade-in modal-overlay">
                        <div className={`${getCardBg()} rounded-xl shadow-2xl p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto`}>
                            <div className="flex justify-between items-center mb-6">
                                <h2 className={`text-2xl font-bold ${getTextColor()}`}>🔗 Matching Items</h2>
                                <button onClick={() => { setShowMatches(false); setSelectedItem(null); setMatches([]); }} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                            </div>
                            {matches.length === 0 ? (
                                <div className="text-center py-8">
                                    <p className={`text-lg ${getSubTextColor()}`}>🔍 No matches found</p>
                                    <p className={`text-sm ${getSubTextColor()} mt-2`}>Try adjusting your search or report a new item</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {matches.map((matchGroup, index) => (
                                        <div key={index} className={`p-4 rounded-lg ${isDarkMode ? 'bg-gray-700' : 'bg-gray-50'} border-l-4 border-purple-500`}>
                                            <p className={`font-semibold ${getTextColor()} mb-3`}>
                                                📌 Matches for: <span className="text-purple-600 font-bold">{matchGroup.itemTitle || 'Unknown Item'}</span>
                                            </p>
                                            {matchGroup.matches && matchGroup.matches.length > 0 ? (
                                                <div className="space-y-2">
                                                    {matchGroup.matches.map((m, idx) => (
                                                        <div key={idx} className={`p-3 rounded-lg ${isDarkMode ? 'bg-gray-800' : 'bg-white'} border`}>
                                                            <p className={`font-medium ${getTextColor()}`}>{m.title}</p>
                                                            <p className={`text-sm ${getSubTextColor()}`}>📂 {m.category || 'N/A'} • 📍 {m.location || 'N/A'}</p>
                                                            <p className={`text-sm ${getSubTextColor()}`}>👤 {m.reportedByName || 'Unknown'} • 📞 {m.contactInfo || 'N/A'}</p>
                                                            {m.matchScore && (
                                                                <p className={`text-xs font-semibold ${m.matchScore >= 70 ? 'text-green-600' : 'text-yellow-600'}`}>
                                                                    Match Score: {m.matchScore}%
                                                                </p>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <p className={`text-sm ${getSubTextColor()}`}>No matching items found</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // ==================== DASHBOARD ====================
    function Dashboard() {
        const [isDarkMode, setIsDarkMode] = useState(() => {
            const savedTheme = localStorage.getItem('theme');
            return savedTheme === 'dark' ? true : false;
        });
        const name = localStorage.getItem('name');
        const email = localStorage.getItem('email');
        const role = localStorage.getItem('role');
        const [sidebarStats, setSidebarStats] = useState({ totalItems: 0, lostItems: 0, foundItems: 0, claimedItems: 0 });

        useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }, [isDarkMode]);

        const handleLogout = () => {
            localStorage.clear();
            window.location.href = '/index-lostfound.html';
        };

        const toggleTheme = () => {
            setIsDarkMode(!isDarkMode);
        };

        return (
            <div className={`flex h-screen ${isDarkMode ? 'dark' : ''}`}>
                {/* Sidebar */}
                <div className={`bg-gray-900 text-white flex flex-col h-screen sticky top-0 sidebar-transition w-64 ${isDarkMode ? 'dark:bg-gray-950' : ''}`}>
                    <div className="p-4 border-b border-gray-800 flex items-center justify-between">
                        <span className="text-xl font-bold">🔍 Lost & Found</span>
                    </div>

                    <div className="flex-1 p-4">
                        <div className="p-4 bg-gradient-to-r from-yellow-500 to-amber-600 rounded-lg text-center text-white">
                            <p className="text-sm font-bold">📋 Items Dashboard</p>
                            <p className="text-xs opacity-80 mt-1">Manage lost & found items</p>
                        </div>

                        <div className="mt-4 space-y-2 sidebar-stats">
                            <div className="p-3 bg-gray-800 rounded-lg text-gray-300 text-xs flex justify-between stat-item">
                                <span>📦 Total Items</span>
                                <span className="font-bold text-yellow-400">{sidebarStats.totalItems}</span>
                            </div>
                            <div className="p-3 bg-gray-800 rounded-lg text-gray-300 text-xs flex justify-between stat-item">
                                <span>❌ Lost</span>
                                <span className="font-bold text-red-400">{sidebarStats.lostItems}</span>
                            </div>
                            <div className="p-3 bg-gray-800 rounded-lg text-gray-300 text-xs flex justify-between stat-item">
                                <span>✅ Found</span>
                                <span className="font-bold text-green-400">{sidebarStats.foundItems}</span>
                            </div>
                            <div className="p-3 bg-gray-800 rounded-lg text-gray-300 text-xs flex justify-between stat-item">
                                <span>🏷️ Claimed</span>
                                <span className="font-bold text-blue-400">{sidebarStats.claimedItems}</span>
                            </div>
                        </div>
                    </div>

                    <div className="p-4 border-t border-gray-800">
                        <button onClick={toggleTheme} className="w-full mb-3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition text-sm flex items-center justify-center gap-2">
                            {isDarkMode ? '☀️' : '🌙'}
                            {isDarkMode ? ' Light Mode' : ' Dark Mode'}
                        </button>
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center text-sm font-bold text-white">
                                {name?.charAt(0) || 'U'}
                            </div>
                            <div className="flex-1">
                                <p className="text-sm font-medium truncate">{name || email}</p>
                                <p className="text-xs text-gray-400">{role}</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="w-full mt-3 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg transition text-sm">
                            🚪 Logout
                        </button>
                    </div>
                </div>

                <div className={`flex-1 overflow-auto ${isDarkMode ? 'dark:bg-gray-900' : 'bg-gray-100'}`}>
                    <LostAndFoundDashboard isDarkMode={isDarkMode} sidebarStats={setSidebarStats} />
                </div>
            </div>
        );
    }

    // ==================== MAIN APP ====================
    function App() {
        const [page, setPage] = useState('login');
        const token = localStorage.getItem('token');

        useEffect(() => {
            if (token && !localStorage.getItem('userId')) {
                localStorage.clear();
                window.location.reload();
            }
        }, []);

        if (token) {
            return <Dashboard />;
        }

        return (
            <div>
                {page === 'login' && <LoginPage onSwitchToRegister={() => setPage('register')} />}
                {page === 'register' && <RegisterPage onSwitchToLogin={() => setPage('login')} />}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
