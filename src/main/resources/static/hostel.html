<script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE_URL = '/api';

    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'index.html';
    }

    const api = axios.create({
        baseURL: API_BASE_URL,
        headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) {
            config.headers.Authorization = `Bearer ${token}`;
        }
        return config;
    });

    api.interceptors.response.use(
        response => response,
        error => {
            if (error.response?.status === 401) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
            return Promise.reject(error);
        }
    );

    const name = localStorage.getItem('name') || 'User';

                    </div>
                    <form onSubmit={handleCreateRule}>
                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Rule Text *</label><input type="text" value={ruleForm.ruleText} onChange={(e) => setRuleForm({...ruleForm, ruleText: e.target.value})} className="input-field" required /></div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Category</label><select value={ruleForm.category} onChange={(e) => setRuleForm({...ruleForm, category: e.target.value})} className="input-field"><option value="General">General</option><option value="Security">Security</option><option value="Cleanliness">Cleanliness</option><option value="Conduct">Conduct</option><option value="Other">Other</option></select></div>
                            <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Priority (1-5)</label><input type="number" value={ruleForm.priority} onChange={(e) => setRuleForm({...ruleForm, priority: e.target.value})} className="input-field" min="1" max="5" /></div>
                        </div>
                        <button type="submit" disabled={loading} className="w-full btn-primary py-2">{loading ? 'Adding...' : '📋 Add Rule'}</button>
                    </form>
                </div>
            </div>
        );

        return (
            <div className={`${isDarkMode ? 'dark' : ''}`}>
                <button className="sidebar-toggle-mobile" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>☰</button>
                <div className={`sidebar-overlay ${isSidebarOpen ? 'active' : ''}`} onClick={() => setIsSidebarOpen(false)} />

                <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${isSidebarOpen ? 'open' : ''}`}>
                    <div className="sidebar-header">
                        <span className="logo-text">🏠 Hostel</span>
                        <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>
                            {isSidebarCollapsed ? '☰' : '◀'}
                        </button>
                    </div>

                    <div className="sidebar-menu">
                        <div className="sidebar-menu-title">Main</div>
                        {menuItems.map(item => (
                            <button
                                key={item.id}
                                className={`sidebar-item ${activeSidebarTab === item.id ? 'active' : ''}`}
                                onClick={() => { setActiveSidebarTab(item.id); setIsSidebarOpen(false); }}
                            >
                                <span className="icon">{item.icon}</span>
                                <span className="sidebar-label">{item.label}</span>
                            </button>
                        ))}
                        <div className="sidebar-menu-title mt-4">Other</div>
                        {isAdmin ? (
                            <a href="admin-dashboard.html" className="sidebar-item">
                                <span className="icon">🏠</span>
                                <span className="sidebar-label">Dashboard</span>
                            </a>
                        ) : (
                            <a href="student-dashboard.html" className="sidebar-item">
                                <span className="icon">🏠</span>
                                <span className="sidebar-label">Dashboard</span>
                            </a>
                        )}
                    </div>

                    <div className="sidebar-footer">
                        <div className="sidebar-user">
                            <div className="sidebar-user-avatar">{name.charAt(0).toUpperCase()}</div>
                            <div className="sidebar-user-info">
                                <div className="sidebar-user-name">{name}</div>
                                <div className="sidebar-user-role">{isAdmin ? 'Admin' : 'Student'}</div>
                            </div>
                        </div>
                        <button className="sidebar-logout" onClick={handleLogout}>
                            <span className="icon">🚪</span>
                            <span className="sidebar-logout-text">Logout</span>
                        </button>
                        <button className="sidebar-logout mt-1" onClick={toggleTheme}>
                            <span className="icon">{isDarkMode ? '☀️' : '🌙'}</span>
                            <span className="sidebar-logout-text">{isDarkMode ? 'Light' : 'Dark'}</span>
                        </button>
                    </div>
                </div>

                <div className="main-content">
                    {renderContent()}
                </div>

                {showHostelModal && renderHostelModal()}
                {showRoomModal && renderRoomModal()}
                {showMaintenanceModal && renderMaintenanceModal()}
                {showRuleModal && renderRuleModal()}
                {showMessMenuModal && renderMessMenuModal()}
            </div>
        );
    }

    ReactDOM.render(<HostelPage />, document.getElementById('root'));
</script>
</body>
</html>
