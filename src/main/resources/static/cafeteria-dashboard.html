                                placeholder="🔍 Search menu items..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="input-field"
                            />
                        </div>
                        <div className="min-w-[150px]">
                            <select
                                value={selectedCategory}
                                onChange={(e) => setSelectedCategory(e.target.value)}
                                className="input-field"
                            >
                                {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            </select>
                        </div>
                    </div>

                    {/* Restaurant Selection */}
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 mb-6">
                        {filteredRestaurants.map(restaurant => (
                            <div
                                key={restaurant.id}
                                className={`restaurant-card card-modern p-3 text-center cursor-pointer ${selectedRestaurant.id === restaurant.id ? 'active' : ''}`}
                                onClick={() => setSelectedRestaurant(restaurant)}
                            >
                                <div className="restaurant-icon">{restaurant.icon}</div>
                                <p className="text-xs font-medium text-gray-800 dark:text-white mt-1 truncate">{restaurant.name}</p>
                            </div>
                        ))}
                        {filteredRestaurants.length === 0 && (
                            <div className="col-span-full text-center py-4 text-gray-500 dark:text-gray-400">
                                No restaurants found
                            </div>
                        )}
                    </div>

                    {/* Restaurant Details */}
                    <div className="card-modern mb-6">
                        <div className="flex items-start gap-4 flex-wrap">
                            <div className="restaurant-icon text-5xl">{selectedRestaurant.icon}</div>
                            <div className="flex-1">
                                <div className="flex justify-between items-start flex-wrap gap-2">
                                    <div>
                                        <h3 className="text-2xl font-bold text-gray-800 dark:text-white">{selectedRestaurant.name}</h3>
                                        <p className="text-sm text-gray-500 dark:text-gray-400">{selectedRestaurant.description}</p>
                                    </div>
                                    <span className="text-sm bg-gray-100 dark:bg-gray-700 px-3 py-1 rounded-full text-gray-600 dark:text-gray-300">
                                        {selectedRestaurant.category}
                                    </span>
                                </div>
                                <div className="flex flex-wrap gap-3 mt-2 text-sm text-gray-500 dark:text-gray-400">
                                    <span>🕐 {selectedRestaurant.openingTime} - {selectedRestaurant.closingTime}</span>
                                    <span>📦 {selectedRestaurant.items.length} items</span>
                                    <span className={selectedRestaurant.isActive ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}>
                                        {selectedRestaurant.isActive ? '✅ Open' : '❌ Closed'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Menu Items */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filteredItems.map(item => (
                            <div key={item.id} className="menu-item-card card-modern hover:shadow-lg transition-shadow">
                                <div className="flex justify-between items-start">
                                    <div className="flex-1">
                                        <h4 className="font-bold text-gray-800 dark:text-white">{item.name}</h4>
                                        <p className="text-sm text-gray-500 dark:text-gray-400 line-clamp-2">{item.description}</p>
                                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                                            <span className={`badge ${getCategoryBadge(item.category)}`}>
                                                {item.category}
                                            </span>
                                            <span className="text-xs text-gray-400 dark:text-gray-500">⏱️ {item.prepTime}m</span>
                                        </div>
                                    </div>
                                    <div className="text-right ml-3">
                                        <p className="text-lg font-bold text-yellow-600 dark:text-yellow-400">₹{item.price}</p>
                                    </div>
                                </div>
                            </div>
                        ))}
                        {filteredItems.length === 0 && (
                            <div className="col-span-full text-center py-8 text-gray-500 dark:text-gray-400">
                                <p className="text-4xl mb-2">🍽️</p>
                                <p>No menu items found</p>
                                {searchQuery && <p className="text-sm text-gray-400 mt-1">Try a different search term</p>}
                            </div>
                        )}
                    </div>

                    {/* Category Quick Links */}
                    <div className="mt-6">
                        <h4 className="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">📂 Browse by Category</h4>
                        <div className="flex flex-wrap gap-2">
                            {categories.filter(c => c !== 'All').map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-3 py-1 rounded-full text-xs font-medium transition ${
                                        selectedCategory === cat
                                            ? 'bg-yellow-500 text-white'
                                            : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                            <button
                                onClick={() => setSelectedCategory('All')}
                                className={`px-3 py-1 rounded-full text-xs font-medium transition ${
                                    selectedCategory === 'All'
                                        ? 'bg-yellow-500 text-white'
                                        : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600'
                                }`}
                            >
                                All
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.render(<CafeteriaDashboard />, document.getElementById('root'));
</script>
</body>
</html>
