<script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE_URL = '/api';

    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'index.html';
    }

    const api = axios.create({
        baseURL: API_BASE_URL,
        headers: { 'Content-Type': 'application/json' }
    });

    api.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) {
            config.headers.Authorization = `Bearer ${token}`;
        }
        return config;
    });

    api.interceptors.response.use(
        response => response,
        error => {
            if (error.response?.status === 401) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
            return Promise.reject(error);
        }
    );

                                            <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1 text-sm">Max Backlogs Allowed</label>
                                            <input type="number" value={driveForm.maxBacklogsAllowed} onChange={(e) => setDriveForm({...driveForm, maxBacklogsAllowed: e.target.value})} className="input-field" placeholder="0" min="0" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Drive Type</label>
                                <select value={driveForm.driveType} onChange={(e) => setDriveForm({...driveForm, driveType: e.target.value})} className="input-field">
                                    <option value="ON_CAMPUS">On Campus</option>
                                    <option value="OFF_CAMPUS">Off Campus</option>
                                    <option value="VIRTUAL">Virtual</option>
                                </select>
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Mode</label>
                                <select value={driveForm.mode} onChange={(e) => setDriveForm({...driveForm, mode: e.target.value})} className="input-field">
                                    <option value="OFFLINE">Offline</option>
                                    <option value="ONLINE">Online</option>
                                    <option value="HYBRID">Hybrid</option>
                                </select>
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Job Role *</label>
                                <input type="text" value={driveForm.jobRole} onChange={(e) => setDriveForm({...driveForm, jobRole: e.target.value})} className="input-field" required />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Salary Package (LPA)</label>
                                <input type="number" value={driveForm.salaryPackage} onChange={(e) => setDriveForm({...driveForm, salaryPackage: e.target.value})} className="input-field" step="0.1" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Min CGPA</label>
                                <input type="number" value={driveForm.minCgpa} onChange={(e) => setDriveForm({...driveForm, minCgpa: e.target.value})} className="input-field" step="0.1" min="0" max="10" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Max Backlogs</label>
                                <input type="number" value={driveForm.maxBacklogs} onChange={(e) => setDriveForm({...driveForm, maxBacklogs: e.target.value})} className="input-field" min="0" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Eligible Branches</label>
                                <input type="text" value={driveForm.eligibleBranches} onChange={(e) => setDriveForm({...driveForm, eligibleBranches: e.target.value})} className="input-field" placeholder="CSE,IT,ECE" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Eligible Years</label>
                                <input type="text" value={driveForm.eligibleYears} onChange={(e) => setDriveForm({...driveForm, eligibleYears: e.target.value})} className="input-field" placeholder="2024,2025" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Application Start Date</label>
                                <input type="date" value={driveForm.applicationStartDate} onChange={(e) => setDriveForm({...driveForm, applicationStartDate: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Application End Date</label>
                                <input type="date" value={driveForm.applicationEndDate} onChange={(e) => setDriveForm({...driveForm, applicationEndDate: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Drive Date</label>
                                <input type="date" value={driveForm.driveDate} onChange={(e) => setDriveForm({...driveForm, driveDate: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Drive Time</label>
                                <input type="time" value={driveForm.driveTime} onChange={(e) => setDriveForm({...driveForm, driveTime: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3 col-span-2">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Venue</label>
                                <input type="text" value={driveForm.venue} onChange={(e) => setDriveForm({...driveForm, venue: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3 col-span-2">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Description</label>
                                <textarea value={driveForm.description} onChange={(e) => setDriveForm({...driveForm, description: e.target.value})} rows="2" className="input-field"></textarea>
                            </div>
                        </div>
                        <button type="submit" disabled={loading} className="w-full btn-primary py-2">{loading ? 'Creating...' : '📋 Create Drive'}</button>
                    </form>
                </div>
            </div>
        );

        const renderInterviewModal = () => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                <div className="modal-content max-w-2xl">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-gray-800 dark:text-white">📅 Schedule Interview</h2>
                        <button onClick={() => { setShowInterviewModal(false); setInterviewForm({...interviewForm, applicationId: ''}); }} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                    </div>
                    <form onSubmit={handleScheduleInterview}>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Interview Date *</label>
                                <input type="date" value={interviewForm.interviewDate} onChange={(e) => setInterviewForm({...interviewForm, interviewDate: e.target.value})} className="input-field" required />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Interview Time *</label>
                                <input type="time" value={interviewForm.interviewTime} onChange={(e) => setInterviewForm({...interviewForm, interviewTime: e.target.value})} className="input-field" required />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Mode</label>
                                <select value={interviewForm.mode} onChange={(e) => setInterviewForm({...interviewForm, mode: e.target.value})} className="input-field">
                                    <option value="OFFLINE">Offline</option>
                                    <option value="ONLINE">Online</option>
                                    <option value="PHONE">Phone</option>
                                </select>
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Venue</label>
                                <input type="text" value={interviewForm.venue} onChange={(e) => setInterviewForm({...interviewForm, venue: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3 col-span-2">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Meeting Link (for online)</label>
                                <input type="url" value={interviewForm.meetingLink} onChange={(e) => setInterviewForm({...interviewForm, meetingLink: e.target.value})} className="input-field" placeholder="https://meet.google.com/..." />
                            </div>
                            <div className="mb-3 col-span-2">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Interview Panel</label>
                                <input type="text" value={interviewForm.interviewPanel} onChange={(e) => setInterviewForm({...interviewForm, interviewPanel: e.target.value})} className="input-field" placeholder="Dr. Sharma, Mr. Kumar" />
                            </div>
                        </div>
                        <button type="submit" disabled={loading} className="w-full btn-primary py-2">{loading ? 'Scheduling...' : '📅 Schedule Interview'}</button>
                    </form>
                </div>
            </div>
        );

        const renderCompanyModal = () => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                <div className="modal-content max-w-2xl">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-bold text-gray-800 dark:text-white">🏢 Add Company</h2>
                        <button onClick={() => setShowCompanyModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                    </div>
                    <form onSubmit={handleCreateCompany}>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Company Name *</label>
                                <input type="text" value={companyForm.name} onChange={(e) => setCompanyForm({...companyForm, name: e.target.value})} className="input-field" required />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Industry</label>
                                <input type="text" value={companyForm.industry} onChange={(e) => setCompanyForm({...companyForm, industry: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Website</label>
                                <input type="url" value={companyForm.website} onChange={(e) => setCompanyForm({...companyForm, website: e.target.value})} className="input-field" placeholder="https://example.com" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Email</label>
                                <input type="email" value={companyForm.email} onChange={(e) => setCompanyForm({...companyForm, email: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Phone</label>
                                <input type="tel" value={companyForm.phone} onChange={(e) => setCompanyForm({...companyForm, phone: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Address</label>
                                <input type="text" value={companyForm.address} onChange={(e) => setCompanyForm({...companyForm, address: e.target.value})} className="input-field" />
                            </div>
                            <div className="mb-3 col-span-2">
                                <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Description</label>
                                <textarea value={companyForm.description} onChange={(e) => setCompanyForm({...companyForm, description: e.target.value})} rows="3" className="input-field" placeholder="Describe the company..." />
                            </div>
                        </div>
                        <button type="submit" disabled={loading} className="w-full btn-primary py-2">{loading ? 'Adding...' : '🏢 Add Company'}</button>
                    </form>
                </div>
            </div>
        );

        const renderContent = () => {
            if (loading) {
                return (
                    <div className="flex justify-center items-center h-64">
                        <div className="text-gray-500 dark:text-gray-400 text-xl">Loading...</div>
                    </div>
                );
            }

            // ✅ Role-based routing: TPO/ADMIN sees admin dashboard, STUDENT sees student dashboard
            if (isTPO) {
                switch(activeTab) {
                    case 'dashboard': return renderAdminDashboard();
                    case 'drives': return renderDrives();
                    case 'applications': return renderApplications();
                    case 'interviews': return renderInterviews();
                    case 'statistics': return renderStatistics();
                    default: return renderAdminDashboard();
                }
            }

            // Student view
            switch(activeTab) {
                case 'dashboard': return renderStudentDashboard();
                case 'drives': return renderDrives();
                case 'applications': return renderApplications();
                case 'interviews': return renderInterviews();
                case 'statistics': return renderStatistics();
                default: return renderStudentDashboard();
            }
        };

        const menuItems = isTPO ? [
            { id: 'dashboard', icon: '📊', label: 'Dashboard' },
            { id: 'drives', icon: '📋', label: 'Drives' },
            { id: 'applications', icon: '👥', label: 'Applications' },
            { id: 'interviews', icon: '📅', label: 'Interviews' },
            { id: 'statistics', icon: '📊', label: 'Statistics' }
        ] : [
            { id: 'dashboard', icon: '📊', label: 'Dashboard' },
            { id: 'drives', icon: '📋', label: 'Drives' },
            { id: 'applications', icon: '📝', label: 'My Applications' },
            { id: 'interviews', icon: '📅', label: 'Interviews' },
            { id: 'statistics', icon: '📊', label: 'Statistics' }
        ];

        const [activeSidebarTab, setActiveSidebarTab] = useState('dashboard');

        return (
            <div className={`${isDarkMode ? 'dark' : ''}`}>
                <button className="sidebar-toggle-mobile" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>☰</button>
                <div className={`sidebar-overlay ${isSidebarOpen ? 'active' : ''}`} onClick={() => setIsSidebarOpen(false)} />

                <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${isSidebarOpen ? 'open' : ''}`}>
                    <div className="sidebar-header">
                        <span className="logo-text">💼 Placement</span>
                        <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>
                            {isSidebarCollapsed ? '☰' : '◀'}
                        </button>
                    </div>

                    <div className="sidebar-menu">
                        <div className="sidebar-menu-title">Main</div>
                        {menuItems.map(item => (
                            <button
                                key={item.id}
                                className={`sidebar-item ${activeSidebarTab === item.id ? 'active' : ''}`}
                                onClick={() => { setActiveSidebarTab(item.id); setActiveTab(item.id); setIsSidebarOpen(false); }}
                            >
                                <span className="icon">{item.icon}</span>
                                <span className="sidebar-label">{item.label}</span>
                            </button>
                        ))}
                        <div className="sidebar-menu-title mt-4">Other</div>
                        {isTPO ? (
                            <a href="admin-dashboard.html" className="sidebar-item">
                                <span className="icon">🏠</span>
                                <span className="sidebar-label">Dashboard</span>
                            </a>
                        ) : (
                            <a href="student-dashboard.html" className="sidebar-item">
                                <span className="icon">🏠</span>
                                <span className="sidebar-label">Dashboard</span>
                            </a>
                        )}
                        {isTPO && (
                            <button onClick={() => setShowCompanyModal(true)} className="sidebar-item">
                                <span className="icon">🏢</span>
                                <span className="sidebar-label">Add Company</span>
                            </button>
                        )}
                    </div>

                    <div className="sidebar-footer">
                        <div className="sidebar-user">
                            <div className="sidebar-user-avatar">{name.charAt(0).toUpperCase()}</div>
                            <div className="sidebar-user-info">
                                <div className="sidebar-user-name">{name}</div>
                                <div className="sidebar-user-role">{isTPO ? 'TPO' : 'Student'}</div>
                            </div>
                        </div>
                        <button className="sidebar-logout" onClick={handleLogout}>
                            <span className="icon">🚪</span>
                            <span className="sidebar-logout-text">Logout</span>
                        </button>
                        <button className="sidebar-logout mt-1" onClick={toggleTheme}>
                            <span className="icon">{isDarkMode ? '☀️' : '🌙'}</span>
                            <span className="sidebar-logout-text">{isDarkMode ? 'Light' : 'Dark'}</span>
                        </button>
                    </div>
                </div>

                <div className="main-content">
                    {renderContent()}
                </div>

                {showDriveModal && renderDriveModal()}
                {showApplyModal && renderApplyModal()}
                {showInterviewModal && renderInterviewModal()}
                {showApplicationModal && renderApplicationModal()}
                {showDriveDetailModal && renderDriveDetailModal()}
                {showCompanyModal && renderCompanyModal()}
            </div>
        );
    }

    ReactDOM.render(<PlacementPage />, document.getElementById('root'));
</script>
</body>
</html>
