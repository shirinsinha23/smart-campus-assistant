<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Smart Campus - Course Material</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .spinner {
        border: 4px solid rgba(0,0,0,0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #3b82f6;
        animation: spin 1s linear infinite;
        display: inline-block;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .sidebar-transition { transition: all 0.3s ease; }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .material-card {
        transition: all 0.3s ease;
        border-radius: 12px;
        overflow: hidden;
    }
    .material-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    .cm-gradient { background: linear-gradient(135deg, #1e3a5f 0%, #4a90d9 100%); }
    .cm-button { background: linear-gradient(to right, #3b82f6, #2563eb); }
    .cm-button:hover { background: linear-gradient(to right, #2563eb, #1d4ed8); }
    .stat-card {
        transition: all 0.3s ease;
        border-radius: 12px;
        cursor: default;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .dark { background-color: #1a1a2e; }
    .dark .bg-white { background-color: #1e1e3a; }
    .dark .text-gray-800 { color: #e0e0e0; }
    .dark .text-gray-600 { color: #b0b0b0; }
    .dark .text-gray-500 { color: #909090; }
    .dark .bg-gray-50 { background-color: #252545; }
    .dark .bg-gray-100 { background-color: #2a2a4a; }
    .dark .shadow-md { box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .dark .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.4); }
    .dark .border-gray-200 { border-color: #333355; }
    .dark .bg-gray-700 { background-color: #3a3a5a; }
    .dark .bg-gray-800 { background-color: #2a2a4a; }
    .dark .bg-gray-900 { background-color: #1a1a2e; }
    .dark .bg-blue-50 { background-color: #1a2a5a; }
    .dark .text-blue-600 { color: #6b9bff; }
    .dark .bg-blue-100 { background-color: #1a2a5a; }
    .dark .border-blue-500 { border-color: #4a7aeb; }
    .dark .bg-gradient-to-r { background-color: #1a1a2e; }
    .type-badge-syllabus { background: #dbeafe; color: #1d4ed8; }
    .type-badge-notes { background: #d1fae5; color: #065f46; }
    .type-badge-assignment { background: #f3e8ff; color: #6d28d9; }
    .type-badge-reference { background: #ffedd5; color: #9a3412; }
    .type-badge-video { background: #fee2e2; color: #991b1b; }
    .type-badge-playlist { background: #d1fae5; color: #065f46; }
    .dark .type-badge-syllabus { background: #1e3a5f; color: #93c5fd; }
    .dark .type-badge-notes { background: #1a3a2a; color: #6ee7b7; }
    .dark .type-badge-assignment { background: #2a1a4a; color: #c4b5fd; }
    .dark .type-badge-reference { background: #3a2a1a; color: #fdba74; }
    .dark .type-badge-video { background: #3a1a1a; color: #fca5a5; }
    .dark .type-badge-playlist { background: #1a3a2a; color: #6ee7b7; }
    .sidebar-item { transition: all 0.2s ease; }
    .sidebar-item:hover { background: rgba(255,255,255,0.08); }
    .welcome-gradient { background: linear-gradient(135deg, #1e3a5f 0%, #4a90d9 50%, #6b9bff 100%); }
    .dark .welcome-gradient { background: linear-gradient(135deg, #0f1a2e 0%, #1a3a5f 50%, #2a4a7a 100%); }
    .empty-state { border: 2px dashed #d1d5db; border-radius: 16px; }
    .dark .empty-state { border-color: #374151; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  const API_BASE_URL = '/api';

  const api = axios.create({
      baseURL: API_BASE_URL,
      headers: { 'Content-Type': 'application/json' }
  });

  api.interceptors.request.use(config => {
      const token = localStorage.getItem('token');
      if (token) {
          config.headers.Authorization = `Bearer ${token}`;
      }
      return config;
  });

  api.interceptors.response.use(
      response => response,
      error => {
          if (error.response?.status === 401) {
              localStorage.clear();
              window.location.href = '/index-coursematerial.html';
          }
          return Promise.reject(error);
      }
  );

  // ==================== LOGIN PAGE ====================
  function LoginPage({ onSwitchToRegister }) {
      const [loginId, setLoginId] = useState('');
      const [email, setEmail] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loading, setLoading] = useState(false);
      const [otpSent, setOtpSent] = useState(false);
      const [otpTimer, setOtpTimer] = useState(0);
      const [resendDisabled, setResendDisabled] = useState(false);
      const [otpInputs, setOtpInputs] = useState(['', '', '', '', '', '']);

      useEffect(() => {
          let interval;
          if (otpTimer > 0) {
              interval = setInterval(() => { setOtpTimer(prev => prev - 1); }, 1000);
          } else {
              setResendDisabled(false);
          }
          return () => clearInterval(interval);
      }, [otpTimer]);

      const handleSendOtp = async (e) => {
          e.preventDefault();
          setError(''); setSuccess(''); setLoading(true);
          if (!loginId || loginId.trim() === '') {
              setError('Please enter your Login ID');
              setLoading(false);
              return;
          }
          try {
              const response = await api.post('/auth/send-otp', { loginId });
              setSuccess('OTP sent successfully to your registered email');
              setOtpSent(true);
              setOtpTimer(60);
              setResendDisabled(true);
              setError('');
              setEmail(response.data.email);
              console.log('📧 OTP for Login ID ' + loginId + ': ' + response.data.otp);
          } catch (err) {
              setError(err.response?.data?.message || 'Failed to send OTP');
          } finally {
              setLoading(false);
          }
      };

      const handleVerifyOtp = async (e) => {
          e.preventDefault();
          setError(''); setSuccess(''); setLoading(true);
          const fullOtp = otpInputs.join('');
          if (fullOtp.length !== 6) {
              setError('Please enter a valid 6-digit OTP');
              setLoading(false);
              return;
          }
          try {
              const response = await api.post('/auth/login', { loginId, otp: fullOtp });
              localStorage.setItem('token', response.data.token);
              localStorage.setItem('userId', response.data.userId);
              localStorage.setItem('loginId', response.data.loginId);
              localStorage.setItem('name', response.data.name);
              localStorage.setItem('email', response.data.email);
              localStorage.setItem('role', response.data.role);
              window.location.reload();
          } catch (err) {
              setError(err.response?.data?.message || 'Invalid or expired OTP');
          } finally {
              setLoading(false);
          }
      };

      const handleOtpInputChange = (index, value) => {
          if (value.length > 1) return;
          const newOtpInputs = [...otpInputs];
          newOtpInputs[index] = value;
          setOtpInputs(newOtpInputs);
          if (value && index < 5) {
              document.getElementById(`otp-input-${index + 1}`)?.focus();
          }
      };

      const handleKeyDown = (index, e) => {
          if (e.key === 'Backspace' && !otpInputs[index] && index > 0) {
              document.getElementById(`otp-input-${index - 1}`)?.focus();
          }
      };

      const handleQuickLogin = (id) => {
          setLoginId(id);
          setTimeout(() => {
              const form = document.querySelector('#loginForm');
              if (form) form.dispatchEvent(new Event('submit'));
          }, 300);
      };

      return (
          <div className="min-h-screen flex items-center justify-center p-4 cm-gradient">
              <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
                  <div className="text-center mb-8">
                      <div className="w-20 h-20 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                          <span className="text-4xl">📚</span>
                      </div>
                      <h1 className="text-3xl font-bold text-gray-800">Course Material</h1>
                      <p className="text-gray-500 text-sm mt-1">Access study resources & syllabus</p>
                      <p className="text-xs text-blue-600 mt-2">🔐 Login with your Campus ID</p>
                  </div>

                  {error && (
                      <div className="bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg mb-4 flex items-start gap-3">
                          <span className="text-xl">⚠️</span>
                          <div><p className="font-medium">Error</p><p className="text-sm">{error}</p></div>
                          <button onClick={() => setError('')} className="ml-auto text-red-700 font-bold">×</button>
                      </div>
                  )}

                  {success && (
                      <div className="bg-green-50 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded-lg mb-4 flex items-start gap-3">
                          <span className="text-xl">✅</span>
                          <div><p className="font-medium">Success</p><p className="text-sm">{success}</p></div>
                          <button onClick={() => setSuccess('')} className="ml-auto text-green-700 font-bold">×</button>
                      </div>
                  )}

                  {!otpSent ? (
                      <form id="loginForm" onSubmit={handleSendOtp}>
                          <div className="mb-4">
                              <label className="block text-gray-700 text-sm font-bold mb-2">Login ID</label>
                              <div className="relative">
                                  <span className="absolute left-3 top-3 text-blue-500">🆔</span>
                                  <input type="text" value={loginId} onChange={(e) => setLoginId(e.target.value)}
                                      className="w-full pl-10 pr-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                      placeholder="Enter your Login ID" required />
                              </div>
                          </div>

                          <div className="mb-4">
                              <p className="text-xs text-gray-500 text-center mb-2">Quick Login</p>
                              <div className="grid grid-cols-3 gap-2">
                                  <button type="button" onClick={() => handleQuickLogin('1001')} className="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 rounded-lg transition text-sm border-2 border-blue-200 hover:border-blue-400">🎓 Student</button>
                                  <button type="button" onClick={() => handleQuickLogin('200001')} className="bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold py-2 rounded-lg transition text-sm border-2 border-purple-200 hover:border-purple-400">👨‍🏫 Faculty</button>
                                  <button type="button" onClick={() => handleQuickLogin('300001')} className="bg-red-100 hover:bg-red-200 text-red-800 font-bold py-2 rounded-lg transition text-sm border-2 border-red-200 hover:border-red-400">👨‍💼 Admin</button>
                              </div>
                          </div>

                          <button type="submit" disabled={loading} className="w-full cm-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50 transform hover:scale-[1.02]">
                              {loading ? (<span className="flex items-center justify-center gap-2"><span className="spinner w-5 h-5"></span>Sending OTP...</span>) : ('📧 Send OTP')}
                          </button>

                          <div className="mt-4 text-center">
                              <button type="button" onClick={onSwitchToRegister} className="text-blue-600 hover:text-blue-800 text-sm font-medium">
                                  Don't have an account? Register here
                              </button>
                          </div>
                      </form>
                  ) : (
                      <form onSubmit={handleVerifyOtp}>
                          <div className="mb-2 text-center">
                              <p className="text-sm text-gray-600">OTP sent to your registered email</p>
                              {email && <p className="text-xs text-gray-500">({email})</p>}
                              <p className="text-xs mt-1 font-medium text-blue-600">
                                  📚 Login ID: <strong>{loginId}</strong>
                              </p>
                          </div>

                          <div className="mb-4">
                              <label className="block text-gray-700 text-sm font-bold mb-4 text-center">Enter 6-Digit OTP</label>
                              <div className="flex justify-center gap-2">
                                  {otpInputs.map((value, index) => (
                                      <input key={index} id={`otp-input-${index}`} type="text" maxLength="1" value={value}
                                          onChange={(e) => handleOtpInputChange(index, e.target.value)}
                                          onKeyDown={(e) => handleKeyDown(index, e)}
                                          className="w-12 h-14 text-center text-2xl font-bold border-2 border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                          autoFocus={index === 0} />
                                  ))}
                              </div>
                          </div>

                          <button type="submit" disabled={loading} className="w-full cm-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50 transform hover:scale-[1.02]">
                              {loading ? (<span className="flex items-center justify-center gap-2"><span className="spinner w-5 h-5"></span>Verifying...</span>) : ('🔐 Verify & Login')}
                          </button>

                          <div className="mt-4 text-center">
                              <button type="button" onClick={() => { setOtpSent(false); setOtpInputs(['', '', '', '', '', '']); }} className="text-gray-500 hover:text-gray-700 text-sm">← Back to Login ID</button>
                              <span className="mx-2 text-gray-300">|</span>
                              <button type="button" onClick={handleSendOtp} disabled={resendDisabled} className={`text-sm ${resendDisabled ? 'text-gray-400 cursor-not-allowed' : 'text-blue-600 hover:text-blue-800'}`}>
                                  {resendDisabled ? `Resend in ${otpTimer}s` : 'Resend OTP'}
                              </button>
                          </div>
                      </form>
                  )}
              </div>
          </div>
      );
  }

  // ==================== REGISTER PAGE ====================
  function RegisterPage({ onSwitchToLogin }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('STUDENT');
      const [phoneNumber, setPhoneNumber] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loading, setLoading] = useState(false);

      const handleRegister = async (e) => {
          e.preventDefault();
          setError(''); setSuccess(''); setLoading(true);
          const defaultPassword = 'user123';
          try {
              await api.post('/auth/register', { name, email, password: defaultPassword, role, phoneNumber });
              setSuccess('Registration successful! Please login with OTP.');
              setTimeout(() => onSwitchToLogin(), 2000);
          } catch (err) {
              setError(err.response?.data?.message || 'Registration failed. Please try again.');
          } finally {
              setLoading(false);
          }
      };

      return (
          <div className="min-h-screen bg-gradient-to-br from-green-600 to-blue-600 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md fade-in">
                  <div className="text-center mb-8">
                      <h1 className="text-4xl font-bold text-gray-800">📝 Join Us</h1>
                      <p className="text-gray-600 mt-2">Create your Smart Campus account</p>
                  </div>
                  {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded mb-4">{error}</div>}
                  {success && <div className="bg-green-100 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded mb-4">{success}</div>}
                  <form onSubmit={handleRegister}>
                      <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Full Name *</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition" placeholder="John Doe" required /></div>
                      <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Email *</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition" placeholder="your@email.com" required /></div>
                      <div className="mb-4"><label className="block text-gray-700 text-sm font-bold mb-2">Phone Number</label><input type="tel" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition" placeholder="10-digit phone number" /></div>
                      <div className="mb-6"><label className="block text-gray-700 text-sm font-bold mb-2">Role</label><select value={role} onChange={(e) => setRole(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition"><option value="STUDENT">🎓 Student</option><option value="FACULTY">👨‍🏫 Faculty</option><option value="ADMIN">👨‍💼 Admin</option></select></div>
                      <div className="mb-4 p-3 bg-blue-50 rounded-lg border border-blue-200"><p className="text-sm text-gray-600"><span className="font-bold">📌 Note:</span> You will login using OTP sent to your email. No password needed!</p></div>
                      <button type="submit" disabled={loading} className="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition disabled:opacity-50 transform hover:scale-[1.02]">{loading ? 'Registering...' : '🚀 Create Account'}</button>
                  </form>
                  <div className="mt-6 text-center"><p className="text-gray-600">Already have an account? <button onClick={onSwitchToLogin} className="text-green-600 font-bold hover:underline">Login here</button></p></div>
              </div>
          </div>
      );
  }

  // ==================== COURSE MATERIAL DASHBOARD ====================
  function CourseMaterialDashboard({ isDarkMode = false }) {
      const [materials, setMaterials] = useState([]);
      const [subjects, setSubjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('ALL');
      const [selectedType, setSelectedType] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const [videoUrl, setVideoUrl] = useState('');
      const [playlistUrl, setPlaylistUrl] = useState('');
      const [uploadType, setUploadType] = useState('file');
      const role = localStorage.getItem('role');
      const userName = localStorage.getItem('name') || 'User';
      const userId = localStorage.getItem('userId');

      const getCardBg = () => isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white';
      const getTextColor = () => isDarkMode ? 'text-white' : 'text-gray-800';
      const getSubTextColor = () => isDarkMode ? 'text-gray-400' : 'text-gray-500';
      const getBgColor = () => isDarkMode ? 'bg-gray-900' : 'bg-gray-100';

      const [formData, setFormData] = useState({
          title: '',
          description: '',
          subject: 'DBMS',
          type: 'NOTES'
      });

      const typeOptions = ['SYLLABUS', 'NOTES', 'ASSIGNMENT', 'REFERENCE', 'VIDEO', 'PLAYLIST'];
      const subjectOptions = ['DBMS', 'OS', 'CN', 'DSA', 'AI', 'ML'];

      useEffect(() => { fetchMaterials(); fetchSubjects(); }, [selectedSubject, selectedType]);

      const fetchMaterials = async () => {
          setLoading(true);
          setError('');
          try {
              let url = '/course-material/all';
              if (selectedSubject !== 'ALL') {
                  url = `/course-material/subject/${selectedSubject}`;
              }
              const response = await api.get(url);
              let data = response.data || [];
              if (selectedType !== 'ALL') {
                  data = data.filter(m => m.type === selectedType);
              }
              setMaterials(data);
          } catch (err) {
              setError('Failed to load materials');
              console.error(err);
          }
          setLoading(false);
      };

      const fetchSubjects = async () => {
          try {
              const response = await api.get('/course-material/subjects');
              setSubjects(response.data || []);
          } catch (err) {
              console.error('Failed to fetch subjects', err);
          }
      };

      const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (file) {
              setSelectedFile(file);
          }
      };

      const handleUpload = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setSuccess('');

          try {
              const formDataToSend = new FormData();

              const materialData = {
                  title: formData.title,
                  description: formData.description,
                  subject: formData.subject,
                  type: formData.type,
                  videoUrl: uploadType === 'video' ? videoUrl : null,
                  playlistUrl: uploadType === 'playlist' ? playlistUrl : null
              };

              formDataToSend.append('material', new Blob([JSON.stringify(materialData)], { type: 'application/json' }));

              if (uploadType === 'file' && selectedFile) {
                  formDataToSend.append('file', selectedFile);
              }

              await api.post('/course-material/upload', formDataToSend, {
                  headers: { 'Content-Type': 'multipart/form-data' }
              });

              setSuccess('Material uploaded successfully!');
              setShowUploadModal(false);
              setFormData({ title: '', description: '', subject: 'DBMS', type: 'NOTES' });
              setSelectedFile(null);
              setVideoUrl('');
              setPlaylistUrl('');
              setUploadType('file');
              fetchMaterials();
          } catch (err) {
              setError(err.response?.data?.error || 'Failed to upload material');
          } finally {
              setLoading(false);
          }
      };

      const handleDelete = async (id) => {
          if (!confirm('Are you sure you want to delete this material?')) return;
          setLoading(true);
          try {
              await api.delete(`/course-material/${id}`);
              setSuccess('Material deleted successfully!');
              fetchMaterials();
          } catch (err) {
              setError('Failed to delete material');
          } finally {
              setLoading(false);
          }
      };

      const filteredMaterials = materials.filter(material =>
          material.title?.toLowerCase().includes(searchTerm.toLowerCase()) ||
          material.subject?.toLowerCase().includes(searchTerm.toLowerCase()) ||
          material.type?.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const getTypeBadgeClass = (type) => {
          switch(type) {
              case 'SYLLABUS': return 'type-badge-syllabus';
              case 'NOTES': return 'type-badge-notes';
              case 'ASSIGNMENT': return 'type-badge-assignment';
              case 'REFERENCE': return 'type-badge-reference';
              case 'VIDEO': return 'type-badge-video';
              case 'PLAYLIST': return 'type-badge-playlist';
              default: return 'bg-gray-100 text-gray-700';
          }
      };

      const getTypeIcon = (type) => {
          switch(type) {
              case 'SYLLABUS': return '📋';
              case 'NOTES': return '📝';
              case 'ASSIGNMENT': return '📄';
              case 'REFERENCE': return '📚';
              case 'VIDEO': return '🎥';
              case 'PLAYLIST': return '📋';
              default: return '📎';
          }
      };

      const totalMaterials = materials.length;
      const totalSubjects = subjects.length;
      const totalNotes = materials.filter(m => m.type === 'NOTES').length;
      const totalAssignments = materials.filter(m => m.type === 'ASSIGNMENT').length;

      const canDelete = (material) => {
          return role === 'ADMIN' || (role === 'FACULTY' && material.uploadedById == userId);
      };

      return (
          <div className={`min-h-screen p-6 ${getBgColor()}`}>
              <div className="welcome-gradient rounded-2xl p-6 text-white mb-6 shadow-lg relative overflow-hidden">
                  <div className="absolute top-0 right-0 opacity-10 text-8xl">📚</div>
                  <div className="relative">
                      <div className="flex justify-between items-center flex-wrap gap-3">
                          <div>
                              <h2 className="text-2xl font-bold">👋 Welcome, {userName}!</h2>
                              <p className="text-white/80 text-sm">
                                  {role === 'STUDENT'
                                      ? 'Access course materials, syllabus, and study resources'
                                      : role === 'FACULTY'
                                      ? 'Manage and upload course materials for your subjects'
                                      : 'Manage all course materials across subjects'
                                  }
                              </p>
                          </div>
                          {(role === 'FACULTY' || role === 'ADMIN') && (
                              <button onClick={() => setShowUploadModal(true)} className="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition flex items-center gap-2 backdrop-blur-sm border border-white/20">
                                  <span className="text-lg">+</span> Upload Material
                              </button>
                          )}
                      </div>
                  </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                  <div className={`${getCardBg()} stat-card p-4 border-l-4 border-blue-500`}>
                      <p className={`text-xs font-medium ${getSubTextColor()} uppercase tracking-wider`}>Total</p>
                      <p className={`text-2xl font-bold ${getTextColor()}`}>{loading ? '...' : totalMaterials}</p>
                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Materials</p>
                  </div>
                  <div className={`${getCardBg()} stat-card p-4 border-l-4 border-green-500`}>
                      <p className={`text-xs font-medium ${getSubTextColor()} uppercase tracking-wider`}>Subjects</p>
                      <p className={`text-2xl font-bold ${getTextColor()}`}>{loading ? '...' : totalSubjects}</p>
                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Available</p>
                  </div>
                  <div className={`${getCardBg()} stat-card p-4 border-l-4 border-purple-500`}>
                      <p className={`text-xs font-medium ${getSubTextColor()} uppercase tracking-wider`}>Notes</p>
                      <p className={`text-2xl font-bold ${getTextColor()}`}>{loading ? '...' : totalNotes}</p>
                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Uploaded</p>
                  </div>
                  <div className={`${getCardBg()} stat-card p-4 border-l-4 border-orange-500`}>
                      <p className={`text-xs font-medium ${getSubTextColor()} uppercase tracking-wider`}>Assignments</p>
                      <p className={`text-2xl font-bold ${getTextColor()}`}>{loading ? '...' : totalAssignments}</p>
                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Uploaded</p>
                  </div>
              </div>

              <div className={`${getCardBg()} rounded-xl shadow-sm p-4 mb-6`}>
                  <div className="flex flex-wrap gap-3">
                      <div className="flex-1 min-w-[200px]">
                          <input
                              type="text"
                              placeholder="🔍 Search materials..."
                              value={searchTerm}
                              onChange={(e) => setSearchTerm(e.target.value)}
                              className={`w-full px-4 py-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                          />
                      </div>
                      <select
                          value={selectedSubject}
                          onChange={(e) => setSelectedSubject(e.target.value)}
                          className={`px-4 py-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                      >
                          <option value="ALL">All Subjects</option>
                          {subjectOptions.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <select
                          value={selectedType}
                          onChange={(e) => setSelectedType(e.target.value)}
                          className={`px-4 py-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                      >
                          <option value="ALL">All Types</option>
                          {typeOptions.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                  </div>
              </div>

              {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 px-4 py-3 rounded-lg mb-4 flex justify-between"><span>{error}</span><button onClick={() => setError('')} className="text-red-700 font-bold">×</button></div>}
              {success && <div className="bg-green-100 border-l-4 border-green-500 text-green-700 px-4 py-3 rounded-lg mb-4 flex justify-between"><span>{success}</span><button onClick={() => setSuccess('')} className="text-green-700 font-bold">×</button></div>}

              {loading ? <div className="flex justify-center items-center py-12"><div className="spinner"></div></div> :
              filteredMaterials.length === 0 ? (
                  <div className={`empty-state text-center py-16 ${getCardBg()}`}>
                      <div className="text-6xl mb-4">📚</div>
                      <p className={`text-lg font-medium ${getTextColor()}`}>No materials found</p>
                      <p className={`text-sm ${getSubTextColor()} mt-1`}>
                          {(role === 'FACULTY' || role === 'ADMIN')
                              ? 'Start by uploading your first course material!'
                              : 'Check back later for new materials from your faculty.'
                          }
                      </p>
                      {(role === 'FACULTY' || role === 'ADMIN') && (
                          <button onClick={() => setShowUploadModal(true)} className="mt-4 cm-button text-white px-6 py-2 rounded-lg transition hover:shadow-lg">
                              + Upload Material
                          </button>
                      )}
                  </div>
              ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {filteredMaterials.map((material) => (
                          <div key={material.id} className={`${getCardBg()} material-card hover:shadow-lg`}>
                              <div className="p-5">
                                  <div className="flex justify-between items-start gap-2">
                                      <h3 className={`font-semibold text-lg ${getTextColor()} truncate`}>{material.title}</h3>
                                      <span className={`px-2 py-1 rounded-full text-xs font-medium whitespace-nowrap ${getTypeBadgeClass(material.type)}`}>
                                          {getTypeIcon(material.type)} {material.type}
                                      </span>
                                  </div>
                                  <p className={`text-sm ${getSubTextColor()} mt-2 line-clamp-2`}>{material.description || 'No description'}</p>
                                  <div className="mt-3 flex flex-wrap gap-2">
                                      <span className={`px-2 py-1 rounded-full text-xs ${isDarkMode ? 'bg-blue-900 text-blue-300' : 'bg-blue-100 text-blue-700'}`}>📂 {material.subject}</span>
                                      <span className={`px-2 py-1 rounded-full text-xs ${isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-100 text-gray-600'}`}>👤 {material.uploadedBy?.name || 'Unknown'}</span>
                                  </div>
                                  <div className="mt-3 flex flex-wrap gap-2">
                                      {material.fileUrl && (
                                          <a href={material.fileUrl} target="_blank" className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg transition text-sm flex items-center gap-1">
                                              📄 Download
                                          </a>
                                      )}
                                      {material.videoUrl && (
                                          <a href={material.videoUrl} target="_blank" className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition text-sm flex items-center gap-1">
                                              🎥 Watch Video
                                          </a>
                                      )}
                                      {material.playlistUrl && (
                                          <a href={material.playlistUrl} target="_blank" className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg transition text-sm flex items-center gap-1">
                                              📋 View Playlist
                                          </a>
                                      )}
                                      {canDelete(material) && (
                                          <button onClick={() => handleDelete(material.id)} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition text-sm flex items-center gap-1">
                                              🗑️ Delete
                                          </button>
                                      )}
                                  </div>
                                  <p className={`text-xs ${getSubTextColor()} mt-3`}>📅 {new Date(material.createdAt).toLocaleDateString()}</p>
                              </div>
                          </div>
                      ))}
                  </div>
              )}

              {showUploadModal && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 fade-in modal-overlay">
                      <div className={`${getCardBg()} rounded-xl shadow-2xl p-8 w-full max-w-md max-h-[90vh] overflow-y-auto`}>
                          <div className="flex justify-between items-center mb-6">
                              <h2 className={`text-2xl font-bold ${getTextColor()}`}>📤 Upload Material</h2>
                              <button onClick={() => setShowUploadModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                          </div>
                          <form onSubmit={handleUpload} encType="multipart/form-data">
                              <div className="mb-4">
                                  <label className={`block ${getTextColor()} font-bold mb-2`}>Title *</label>
                                  <input type="text" value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} required />
                              </div>
                              <div className="mb-4">
                                  <label className={`block ${getTextColor()} font-bold mb-2`}>Description</label>
                                  <textarea value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} rows="3" className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} />
                              </div>
                              <div className="mb-4">
                                  <label className={`block ${getTextColor()} font-bold mb-2`}>Subject *</label>
                                  <select value={formData.subject} onChange={(e) => setFormData({...formData, subject: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} required>
                                      {subjectOptions.map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                              </div>
                              <div className="mb-4">
                                  <label className={`block ${getTextColor()} font-bold mb-2`}>Type *</label>
                                  <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`} required>
                                      {typeOptions.map(t => <option key={t} value={t}>{t}</option>)}
                                  </select>
                              </div>

                              <div className="mb-4">
                                  <label className={`block ${getTextColor()} font-bold mb-2`}>Upload Type</label>
                                  <div className="grid grid-cols-3 gap-2">
                                      <button
                                          type="button"
                                          onClick={() => setUploadType('file')}
                                          className={`px-4 py-2 rounded-lg transition ${
                                              uploadType === 'file'
                                                  ? 'bg-blue-600 text-white'
                                                  : isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-200 text-gray-600'
                                          }`}
                                      >
                                          📄 File
                                      </button>
                                      <button
                                          type="button"
                                          onClick={() => setUploadType('video')}
                                          className={`px-4 py-2 rounded-lg transition ${
                                              uploadType === 'video'
                                                  ? 'bg-blue-600 text-white'
                                                  : isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-200 text-gray-600'
                                          }`}
                                      >
                                          🎥 Video
                                      </button>
                                      <button
                                          type="button"
                                          onClick={() => setUploadType('playlist')}
                                          className={`px-4 py-2 rounded-lg transition ${
                                              uploadType === 'playlist'
                                                  ? 'bg-blue-600 text-white'
                                                  : isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-200 text-gray-600'
                                          }`}
                                      >
                                          📋 Playlist
                                      </button>
                                  </div>
                              </div>

                              {uploadType === 'file' && (
                                  <div className="mb-4">
                                      <label className={`block ${getTextColor()} font-bold mb-2`}>File</label>
                                      <input
                                          type="file"
                                          onChange={handleFileChange}
                                          className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                                      />
                                      {selectedFile && <p className={`text-sm ${getSubTextColor()} mt-1`}>📎 {selectedFile.name}</p>}
                                  </div>
                              )}

                              {uploadType === 'video' && (
                                  <div className="mb-4">
                                      <label className={`block ${getTextColor()} font-bold mb-2`}>Video URL *</label>
                                      <input
                                          type="url"
                                          value={videoUrl}
                                          onChange={(e) => setVideoUrl(e.target.value)}
                                          placeholder="https://www.youtube.com/watch?v=..."
                                          className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                                          required={uploadType === 'video'}
                                      />
                                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Supports YouTube, Vimeo, and any video link</p>
                                  </div>
                              )}

                              {uploadType === 'playlist' && (
                                  <div className="mb-4">
                                      <label className={`block ${getTextColor()} font-bold mb-2`}>YouTube Playlist URL *</label>
                                      <input
                                          type="url"
                                          value={playlistUrl}
                                          onChange={(e) => setPlaylistUrl(e.target.value)}
                                          placeholder="https://www.youtube.com/playlist?list=..."
                                          className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'}`}
                                          required={uploadType === 'playlist'}
                                      />
                                      <p className={`text-xs ${getSubTextColor()} mt-1`}>Paste the full YouTube playlist URL</p>
                                  </div>
                              )}

                              <button type="submit" disabled={loading} className="w-full cm-button text-white font-bold py-3 rounded-lg hover:shadow-lg transition disabled:opacity-50">{loading ? 'Uploading...' : '📤 Upload Material'}</button>
                          </form>
                      </div>
                  </div>
              )}
          </div>
      );
  }

  // ==================== DASHBOARD ====================
  function Dashboard() {
      const [isDarkMode, setIsDarkMode] = useState(() => {
          const savedTheme = localStorage.getItem('theme');
          return savedTheme === 'dark' ? true : false;
      });
      const name = localStorage.getItem('name');
      const email = localStorage.getItem('email');
      const role = localStorage.getItem('role');

      useEffect(() => {
          if (isDarkMode) {
              document.documentElement.classList.add('dark');
              localStorage.setItem('theme', 'dark');
          } else {
              document.documentElement.classList.remove('dark');
              localStorage.setItem('theme', 'light');
          }
      }, [isDarkMode]);

      const handleLogout = () => {
          localStorage.clear();
          window.location.href = '/index-coursematerial.html';
      };

      const toggleTheme = () => {
          setIsDarkMode(!isDarkMode);
      };

      return (
          <div className={`flex h-screen ${isDarkMode ? 'dark' : ''}`}>
              <div className={`bg-gray-900 text-white flex flex-col h-screen sticky top-0 sidebar-transition w-64 ${isDarkMode ? 'dark:bg-gray-950' : ''}`}>
                  <div className="p-4 border-b border-gray-800 flex items-center justify-between">
                      <span className="text-xl font-bold">📚 Course Material</span>
                  </div>

                  <div className="flex-1 p-4">
                      <div className="p-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg text-center text-white">
                          <p className="text-sm font-bold">📋 Materials</p>
                          <p className="text-xs opacity-80 mt-1">Study resources</p>
                      </div>
                  </div>

                  <div className="p-4 border-t border-gray-800">
                      <button onClick={toggleTheme} className="w-full mb-3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg transition text-sm flex items-center justify-center gap-2">
                          {isDarkMode ? '☀️' : '🌙'}
                          {isDarkMode ? ' Light Mode' : ' Dark Mode'}
                      </button>
                      <div className="flex items-center gap-3">
                          <div className="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold text-white">
                              {name?.charAt(0) || 'U'}
                          </div>
                          <div className="flex-1">
                              <p className="text-sm font-medium truncate">{name || email}</p>
                              <p className="text-xs text-gray-400">{role}</p>
                          </div>
                      </div>
                      <button onClick={handleLogout} className="w-full mt-3 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg transition text-sm">
                          🚪 Logout
                      </button>
                  </div>
              </div>

              <div className={`flex-1 overflow-auto ${isDarkMode ? 'dark:bg-gray-900' : 'bg-gray-100'}`}>
                  <CourseMaterialDashboard isDarkMode={isDarkMode} />
              </div>
          </div>
      );
  }

  // ==================== MAIN APP ====================
  function App() {
      const [page, setPage] = useState('login');
      const token = localStorage.getItem('token');

      useEffect(() => {
          if (token && !localStorage.getItem('userId')) {
              localStorage.clear();
              window.location.reload();
          }
      }, []);

      if (token) {
          return <Dashboard />;
      }

      return (
          <div>
              {page === 'login' && <LoginPage onSwitchToRegister={() => setPage('register')} />}
              {page === 'register' && <RegisterPage onSwitchToLogin={() => setPage('login')} />}
          </div>
      );
  }

  ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
