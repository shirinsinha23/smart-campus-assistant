<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect } = React;
    const api = axios.create({
        baseURL: '/api',
        headers: { 'Content-Type': 'application/json' },
        timeout: 8000
    });
    api.interceptors.request.use(config => {
        const token = localStorage.getItem('token');
        if (token) config.headers.Authorization = `Bearer ${token}`;
        return config;
    });
    api.interceptors.response.use(
        res => res,
        err => {
            if (err.response?.status === 401) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
            return Promise.reject(err);
        }
    );

    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';
    const name = localStorage.getItem('name') || 'Student';
    const userId = localStorage.getItem('userId') || '1';

    async function apiCall(method, url, data, config) {
        try {
            const res = await api[method](url, data, config);
            return { ok: true, data: res.data };
        } catch (err) {
            return { ok: false, error: err };
        }
    }

    function safeStr(val, fallback = 'N/A') {
        if (val === null || val === undefined) return fallback;
        if (typeof val === 'string') return val;
        if (typeof val === 'number' || typeof val === 'boolean') return String(val);
        if (typeof val === 'object') {
            return val.name || val.title || val.username || val.fullName || val.displayName || fallback;
        }
        return fallback;
    }

    const MESS_MENU_STATIC = {
        veg: {
            Monday: { breakfast: 'Poha, Upma, Tea, Coffee, Milk', lunch: 'Roti, Dal, Rice, Mixed Veg, Salad', dinner: 'Roti, Paneer Butter Masala, Rice, Dal, Sweet' },
            Tuesday: { breakfast: 'Idli, Sambhar, Coconut Chutney, Tea', lunch: 'Roti, Chole, Jeera Rice, Raita, Papad', dinner: 'Roti, Aloo Gobi, Rice, Dal, Salad' },
            Wednesday: { breakfast: 'Dosa, Sambhar, Chutney, Tea, Coffee', lunch: 'Roti, Rajma, Rice, Mixed Veg, Salad', dinner: 'Roti, Shahi Paneer, Rice, Dal, Sweet' },

const handleApplyLeave = async (e) => {
    e.preventDefault();
    if (!leaveForm.title.trim() || !leaveForm.startDate || !leaveForm.endDate) {
        showMessage('Title, start date and end date are required', 'error');
        return;
    }
    setGlobalLoading(true);
    try {
        const fd = new FormData();
        const leaveJson = {
            title: leaveForm.title.trim(),
            description: leaveForm.description.trim() || '',
            startDate: leaveForm.startDate,
            endDate: leaveForm.endDate,
            leaveType: leaveForm.leaveType
        };
        fd.append('leave',
            new Blob([JSON.stringify(leaveJson)], { type: 'application/json' }));
        if (leaveForm.proofFile) {
            fd.append('file', leaveForm.proofFile, leaveForm.proofFile.name);
        }

        const res = await apiCall('post', `/leaves?userId=${userId}`, fd, {
            headers: { 'Content-Type': 'multipart/form-data' }
        });

        if (res.ok) {
            showMessage('✅ Leave request submitted', 'success');
            setShowLeaveModal(false);
            setLeaveForm({
                title: '', description: '',
                startDate: '', endDate: '',
                leaveType: 'CASUAL',
                proofFile: null
            });
            await fetchLeaves();
        } else {
            const msg = res.error?.response?.data?.error
                || res.error?.response?.data?.message
                || res.error?.message
                || 'Failed to submit leave';
            showMessage('❌ ' + msg, 'error');
        }
    } finally {
        setGlobalLoading(false);
    }
};

const handleCancelLeave = async (leaveId) => {
    if (!confirm('Cancel this leave request?')) return;
    setGlobalLoading(true);
    const res = await apiCall('delete', `/leaves/${leaveId}?userId=${userId}`);
    if (res.ok) {
        showMessage('✅ Leave cancelled', 'success');

};

                                    <div className="flex gap-2">
                                        <button onClick={() => setMessType('veg')} className={`px-4 py-2 rounded-lg font-semibold text-sm ${messType === 'veg' ? 'bg-green-500 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}>🟢 Veg</button>
                                        <button onClick={() => setMessType('nonVeg')} className={`px-4 py-2 rounded-lg font-semibold text-sm ${messType === 'nonVeg' ? 'bg-red-500 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}>🔴 Non-Veg</button>
                                    </div>
                                </div>
                            </div>
                            <div className="card-modern mb-4">
                                <h4 className="font-bold text-gray-800 dark:text-white mb-3">📅 Today ({today})</h4>
                                <div className="space-y-2">
                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">🌅 Breakfast</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{todayMenu.breakfast}</span></div>
                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">☀️ Lunch</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{todayMenu.lunch}</span></div>
                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">🌙 Dinner</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{todayMenu.dinner}</span></div>
                                </div>
                            </div>
                            <button onClick={() => setShowFullMessModal(true)} className="btn-primary w-full py-2">📅 View Full Week Menu</button>
                        </div>
                    )}
                    {hostelTab === 'rules' && (
                        <div className="card-modern">
                            <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-4">📜 Hostel Rules</h3>
                            {hostelRules.map(rule => (
                                <div key={rule.id} className="rule-item">
                                    <div className="flex justify-between items-start">
                                        <p className="text-gray-800 dark:text-white text-sm font-medium">{rule.id}. {safeStr(rule.rule || rule.ruleText)}</p>
                                        <span className={`badge ${rule.priority === 1 ? 'badge-rejected' : rule.priority === 2 ? 'badge-pending' : 'badge-inprogress'} ml-2`}>{rule.priority === 1 ? 'Strict' : rule.priority === 2 ? 'Important' : 'General'}</span>
                                    </div>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">Category: {safeStr(rule.category)}</p>
                                </div>
                            ))}
                        </div>
                    )}
                    {hostelTab === 'complaints' && (
                        <div>
                            <div className="card-modern mb-4">
                                <div className="flex justify-between items-center flex-wrap gap-3">
                                    <h3 className="text-lg font-bold text-gray-800 dark:text-white">🔧 Maintenance Requests</h3>
                                    <button onClick={() => setShowHostelComplaintModal(true)} className="btn-warning text-sm py-1 px-3">+ Raise Request</button>
                                </div>
                            </div>
                            {hostelComplaints.length === 0 ? ( <div className="card-modern empty-state"><span className="icon">🔧</span>No maintenance requests</div> ) : (
                                <div className="space-y-3">
                                    {hostelComplaints.map(c => (
                                        <div key={c.id} className={`card-modern border-l-4 ${c.priority === 'HIGH' ? 'border-red-500' : c.priority === 'MEDIUM' ? 'border-yellow-500' : 'border-blue-500'}`}>
                                            <h4 className="font-bold text-gray-800 dark:text-white">{safeStr(c.title)}</h4>
                                            <p className="text-sm text-gray-600 dark:text-gray-300 mt-1">{safeStr(c.description)}</p>
                                            <div className="flex flex-wrap gap-2 mt-2 text-xs">
                                                <span className="bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">{safeStr(c.category)}</span>
                                                <span className={`badge ${c.status === 'PENDING' ? 'badge-pending' : c.status === 'IN_PROGRESS' ? 'badge-inprogress' : 'badge-resolved'}`}>{safeStr(c.status)}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    {showHostelBookingModal && selectedHostelRoom && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">🎫 Request Room</h2>
                                    <button onClick={() => { setShowHostelBookingModal(false); setSelectedHostelRoom(null); }} className="text-gray-500 text-2xl">×</button>
                                </div>
                                <div className="mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                    <h3 className="font-bold text-gray-800 dark:text-white">Room {safeStr(selectedHostelRoom.roomNumber)} • {safeStr(selectedHostelRoom.hostelName)}</h3>
                                    <p className="text-sm text-gray-600 dark:text-gray-300">{getRoomTypeLabel(selectedHostelRoom.roomType)} • {(selectedHostelRoom.hasAc || selectedHostelRoom.ac) ? '❄️ AC' : '🌬️ Non-AC'}</p>
                                    <p className="rent-display mt-2">₹{(selectedHostelRoom.rentPerMonth || selectedHostelRoom.rent || 0).toLocaleString()}/month</p>
                                </div>
                                <div className="p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg mb-4">
                                    <p className="text-sm text-blue-700 dark:text-blue-300">ℹ️ Room allocation is done by the hostel warden. Your request will be reviewed shortly.</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => { showMessage('✅ Room request submitted!', 'success'); setShowHostelBookingModal(false); setSelectedHostelRoom(null); }} className="btn-success flex-1 py-2">✅ Submit Request</button>
                                    <button type="button" onClick={() => { setShowHostelBookingModal(false); setSelectedHostelRoom(null); }} className="btn-danger py-2 px-4">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showHostelComplaintModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">🔧 Raise Maintenance Request</h2>
                                    <button onClick={() => setShowHostelComplaintModal(false)} className="text-gray-500 text-2xl">×</button>
                                </div>
                                <form onSubmit={handleCreateHostelComplaint}>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Title *</label><input type="text" value={hostelComplaintForm.title} onChange={(e) => setHostelComplaintForm({...hostelComplaintForm, title: e.target.value})} className="input-field" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Description *</label><textarea value={hostelComplaintForm.description} onChange={(e) => setHostelComplaintForm({...hostelComplaintForm, description: e.target.value})} rows="3" className="input-field" required /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="mb-3"> <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Category</label> <select value={hostelComplaintForm.category} onChange={(e) => setHostelComplaintForm({...hostelComplaintForm, category: e.target.value})} className="input-field"> <option value="Plumbing">🚰 Plumbing</option><option value="Electrical">💡 Electrical</option> <option value="Furniture">🪑 Furniture</option><option value="AC">❄️ AC</option> <option value="WiFi">📶 WiFi</option><option value="Cleaning">🧹 Cleaning</option> <option value="Other">📌 Other</option> </select> </div>
                                        <div className="mb-3"> <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Priority</label> <select value={hostelComplaintForm.priority} onChange={(e) => setHostelComplaintForm({...hostelComplaintForm, priority: e.target.value})} className="input-field"> <option value="HIGH">🔴 High</option><option value="MEDIUM">🟡 Medium</option><option value="LOW">🟢 Low</option> </select> </div>
                                    </div>
                                    <button type="submit" disabled={globalLoading} className="w-full btn-warning py-2">{globalLoading ? 'Submitting...' : '🔧 Submit'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    {showFullMessModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-3xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">🍽️ Weekly Mess - {messType === 'veg' ? '🟢 Veg' : '🔴 Non-Veg'}</h2>
                                    <button onClick={() => setShowFullMessModal(false)} className="text-gray-500 text-2xl">×</button>
                                </div>
                                <div className="space-y-3 max-h-[60vh] overflow-y-auto">
                                    {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(day => {
                                        const menu = (messMenu[messType] && messMenu[messType][day]) || { breakfast: '-', lunch: '-', dinner: '-' };
                                        return (
                                            <div key={day} className={`p-3 rounded-lg ${day === today ? 'bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500' : 'bg-gray-50 dark:bg-gray-700'}`}>
                                                <h4 className="font-bold text-gray-800 dark:text-white">{day} {day === today && <span className="text-xs bg-blue-500 text-white px-2 py-0.5 rounded-full ml-2">Today</span>}</h4>
                                                <div className="space-y-1 text-sm mt-2">
                                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">🌅</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{menu.breakfast}</span></div>
                                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">☀️</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{menu.lunch}</span></div>
                                                    <div className="mess-menu-row"><span className="font-medium text-gray-700 dark:text-gray-300">🌙</span><span className="text-sm text-gray-600 dark:text-gray-400 text-right ml-4">{menu.dinner}</span></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <button onClick={() => setShowFullMessModal(false)} className="btn-primary w-full py-2 mt-4">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const renderContent = () => {
            switch (activeTab) {
                case 'dashboard': return renderDashboard();
                case 'hostel': return renderHostel();
                case 'courseMaterials': return renderCourseMaterials();
                case 'attendance': return renderAttendance();
                case 'timetable': return renderTimetable();
                case 'noticeboard': return renderNoticeBoard();
                case 'lostfound': return renderLostFound();
                case 'assignments': return renderAssignments();
                case 'library': return renderLibrary();
                case 'complaints': return renderComplaints();
                case 'events': return renderEvents();
                case 'transport': return renderTransport();
                case 'feedback': return renderFeedback();
                case 'cafeteria': return renderCafeteria();
                case 'placement': return renderPlacement();
                case 'chatbot': window.location.href = 'chatbot.html'; return null;
                case 'campus': window.location.href = 'campus-view.html'; return null;
                case 'leaves': return renderLeaves();
                default: return renderDashboard();
            }
        };

        const menuItems = [
            { id: 'dashboard', icon: '📊', label: 'Dashboard' },
            { id: 'hostel', icon: '🏠', label: 'Hostel Management' },
            { id: 'courseMaterials', icon: '📚', label: 'Course Materials' },
            { id: 'attendance', icon: '📈', label: 'Attendance' },
            { id: 'timetable', icon: '📅', label: 'Timetable' },
            { id: 'noticeboard', icon: '📋', label: 'Notice Board' },
            { id: 'lostfound', icon: '🔍', label: 'Lost & Found' },
            { id: 'assignments', icon: '📝', label: 'Assignments' },
            { id: 'library', icon: '📖', label: 'Library' },
            { id: 'complaints', icon: '📋', label: 'My Complaints' },
            { id: 'events', icon: '📅', label: 'Events' },
            { id: 'transport', icon: '🚌', label: 'Transport' },
            { id: 'feedback', icon: '📝', label: 'Feedback' },
            { id: 'cafeteria', icon: '🍽️', label: 'Cafeteria' },
            { id: 'placement', icon: '💼', label: 'Placement' },
            { id: 'chatbot', icon: '🤖', label: 'Chat Assistant' },
            { id: 'campus', icon: '🌍', label: 'Campus View' },
            { id: 'leaves', icon: '📋', label: 'My Leaves' }
        ];

        return (
            <div className={`${isDarkMode ? 'dark' : ''}`}>
                {globalLoading && <div className="loading-overlay"><div className="loading-spinner"></div></div>}
                <button className="sidebar-toggle-mobile" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>☰</button>
                <div className={`sidebar-overlay ${isSidebarOpen ? 'active' : ''}`} onClick={() => setIsSidebarOpen(false)} />
                <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${isSidebarOpen ? 'open' : ''}`}>
                    <div className="sidebar-header">
                        <span className="logo-text">🎓 Student</span>
                        <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>{isSidebarCollapsed ? '☰' : '◀'}</button>
                    </div>
                    <div className="sidebar-menu">
                        <div className="sidebar-menu-title">Main</div>
                        {menuItems.map(item => (
                            <button key={item.id} className={`sidebar-item ${activeTab === item.id ? 'active' : ''}`} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); }}>
                                <span className="icon">{item.icon}</span>
                                <span className="sidebar-label">{item.label}</span>
                            </button>
                        ))}
                    </div>
                    <div className="sidebar-footer">
                        <div className="sidebar-user">
                            <div className="sidebar-user-avatar">{safeStr(name).charAt(0).toUpperCase()}</div>
                            <div className="sidebar-user-info">
                                <div className="sidebar-user-name">{safeStr(name)}</div>
                                <div className="sidebar-user-role">Student</div>
                            </div>
                        </div>
                        <button className="sidebar-logout" onClick={handleLogout}><span className="icon">🚪</span><span className="sidebar-logout-text">Logout</span></button>
                        <button className="sidebar-logout mt-1" onClick={toggleTheme}><span className="icon">{isDarkMode ? '☀️' : '🌙'}</span><span className="sidebar-logout-text">{isDarkMode ? 'Light' : 'Dark'}</span></button>
                    </div>
                </div>
                <div className="main-content">
                {message.text && (
                    <div
                        className={`fixed bottom-6 right-6 z-[9999] px-4 py-3 rounded-lg shadow-2xl text-white font-semibold pointer-events-none ${message.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}
                    >
                        {message.text}
                    </div>
                    )}
                    {renderContent()}
                </div>
            </div>
        );
    }

    ReactDOM.render(<StudentDashboard />, document.getElementById('root'));
</script>
</body>
</html>
