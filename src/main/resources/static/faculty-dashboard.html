<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  const API_BASE_URL = '/api';

  const token = localStorage.getItem('token');
  if (!token) {
      window.location.href = 'index.html';
  }

  const api = axios.create({
      baseURL: API_BASE_URL,
      headers: { 'Content-Type': 'application/json' }
  });

  api.interceptors.request.use(config => {
      const t = localStorage.getItem('token');
      if (t) config.headers.Authorization = `Bearer ${t}`;
      return config;
  });

  api.interceptors.response.use(
      response => response,
      error => {
          if (error.response?.status === 401) {
              localStorage.clear();
              window.location.href = 'index.html';
          }
          return Promise.reject(error);
      }
  );

  const name = localStorage.getItem('name') || 'Faculty';
  const userId = localStorage.getItem('userId');
  const loginId = localStorage.getItem('loginId');

  const getCurrentDay = () => {
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      return days[new Date().getDay()];
  };

  const ALL_SUBJECTS = ['DBMS', 'OS', 'CN', 'DSA', 'AI', 'ML', 'MOBILE_COMPUTING', 'CAPSTONE_PROJECT'];

  function FacultyDashboard() {
      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState({ text: '', type: '' });

      // ===== REAL DATA STATE =====
      const [students, setStudents] = useState([]);
      const [timetable, setTimetable] = useState([]);
      const [attendanceRecords, setAttendanceRecords] = useState([]);
      const [attendanceStats, setAttendanceStats] = useState({ total: 0, present: 0, percentage: 0 });
      const [books, setBooks] = useState([]);
      const [notices, setNotices] = useState([]);
      const [leaves, setLeaves] = useState([]);
      const [feedbackList, setFeedbackList] = useState([]);
      const [assignments, setAssignments] = useState([]);
      const [attendanceSummaries, setAttendanceSummaries] = useState([]);
      const [summariesLoading, setSummariesLoading] = useState(false);

      // Assignment creation state
      const [showCreateAssignmentModal, setShowCreateAssignmentModal] = useState(false);
      const [assignmentForm, setAssignmentForm] = useState({
          title: '',
          description: '',
          subject: 'DBMS',
          deadline: '',
          maxScore: 10,
          questionFile: null
      });

      // Attendance marking state
      const [markForm, setMarkForm] = useState({
          subject: 'DBMS',
          date: new Date().toISOString().split('T')[0],
          statuses: {}
      });

      // Library add-book state
      const [showAddBookModal, setShowAddBookModal] = useState(false);
      const [bookForm, setBookForm] = useState({
          title: '', author: '', isbn: '', category: 'Textbook', location: '', totalCopies: 1, availableCopies: 1
      });

      // Course materials state
      const [courseMaterials, setCourseMaterials] = useState([]);
      const [mySubjects, setMySubjects] = useState([]);
      const [materialFilter, setMaterialFilter] = useState('ALL');
      const [showUploadMaterialModal, setShowUploadMaterialModal] = useState(false);
      const [materialForm, setMaterialForm] = useState({
          title: '', description: '', subject: '', type: 'NOTES',
          uploadMode: 'FILE', file: null, videoUrl: '', playlistUrl: ''
      });

      const showMessage = (text, type) => {
          setMessage({ text, type });
          setTimeout(() => setMessage({ text: '', type: '' }), 4000);
      };

      const handleLogout = () => { localStorage.clear(); window.location.href = 'index.html'; };
      const toggleTheme = () => {
          const newMode = !isDarkMode;
          setIsDarkMode(newMode);
          localStorage.setItem('theme', newMode ? 'dark' : 'light');
      };

      // ===== FETCHERS =====
      const fetchStudents = async () => {
          try {
              const res = await api.get('/users/students');
              if (Array.isArray(res.data)) {
                  setStudents(res.data);
                  const init = {};
                  res.data.forEach(s => { init[s.id] = 'PRESENT'; });
                  setMarkForm(prev => ({ ...prev, statuses: init }));
              }
          } catch (err) { console.error('Failed to load students:', err); }
      };

      const fetchTimetable = async () => {
          try {
              const res = await api.get(`/timetable/faculty/${userId}`);
              if (Array.isArray(res.data)) setTimetable(res.data);
          } catch (err) { console.error('Failed to load timetable:', err); }
      };

      const fetchBooks = async () => {
          try {
              const res = await api.get('/library/books');
              if (Array.isArray(res.data)) setBooks(res.data);
          } catch (err) { console.error('Failed to load books:', err); }
      };

      const fetchNotices = async () => {
          try {
              const res = await api.get('/notices');
              if (Array.isArray(res.data)) setNotices(res.data);
          } catch (err) { console.error('Failed to load notices:', err); }
      };

      const fetchLeaves = async () => {
          try {
              const res = await api.get('/leaves/all');
              // The API returns { leaves: [...], totalItems, totalPages, ... }
              if (res.data && Array.isArray(res.data.leaves)) {
                  setLeaves(res.data.leaves);
              } else if (Array.isArray(res.data)) {
                  setLeaves(res.data);
              } else {
                  setLeaves([]);
              }
          } catch (err) {
              if (err.response?.status !== 403) console.error('Failed to load leaves:', err);
              setLeaves([]);
          }
      };

      const fetchFeedbacks = async () => {
          try {
              const res = await api.get('/feedback/all');
              if (Array.isArray(res.data)) setFeedbackList(res.data);
          } catch (err) {
              if (err.response?.status !== 403) console.error('Failed to load feedback:', err);
          }
      };

      const fetchAssignments = async () => {
          try {
              const res = await api.get('/assignments');
              if (Array.isArray(res.data)) setAssignments(res.data);
              else setAssignments([]);
          } catch (err) {
              console.error('Failed to load assignments:', err);
              setAssignments([]);
          }
      };

      const fetchAttendanceSummaries = async () => {
          if (students.length === 0) return;
          setSummariesLoading(true);
          try {
              const results = await Promise.all(
                  students.map(async (s) => {
                      const res = await api.get(`/attendance/student/${s.id}/summary`);
                      return {
                          studentId: s.id,
                          loginId: s.loginId,
                          name: s.name,
                          total: res.data?.totalClasses || 0,
                          present: res.data?.presentCount || 0,
                          percentage: res.data?.percentage || 0,
                      };
                  })
              );
              setAttendanceSummaries(results);
          } catch (err) {
              console.error('Failed to load attendance summaries:', err);
              setAttendanceSummaries([]);
          } finally {
              setSummariesLoading(false);
          }
      };

      // ===== LEAVE APPROVE / REJECT =====
      const handleApproveLeave = async (leaveId) => {
          if (!confirm('Approve this leave?')) return;
          try {
              const approverId = localStorage.getItem('userId');
              await api.put(`/leaves/${leaveId}/approve?approverId=${approverId}`);
              showMessage('✅ Leave approved', 'success');
              fetchLeaves();
          } catch (err) {
              const msg = err.response?.data?.error || err.response?.data?.message || 'Approve failed';
              showMessage('❌ ' + msg, 'error');
          }
      };

      const handleRejectLeave = async (leaveId) => {
          const reason = prompt('Reason for rejection:');
          if (!reason) return;
          try {
              await api.put(`/leaves/${leaveId}/reject?reason=${encodeURIComponent(reason)}`);
              showMessage('✅ Leave rejected', 'success');
              fetchLeaves();
          } catch (err) {
              const msg = err.response?.data?.error || err.response?.data?.message || 'Reject failed';
              showMessage('❌ ' + msg, 'error');
          }
      };

      // Load everything once on mount
      useEffect(() => {
          fetchStudents();
          fetchTimetable();
          fetchBooks();
          fetchNotices();
          fetchLeaves();
          fetchFeedbacks();
          fetchAssignments();
      }, []);

      // Tab-specific fetchers
      useEffect(() => {
          if (activeTab === 'courseMaterials') {
              fetchCourseMaterials();
              if (mySubjects.length === 0) fetchMySubjects();
          }
          if (activeTab === 'attendance' && students.length > 0) {
              fetchAttendanceSummaries();
          }
          if (activeTab === 'leaves') {
              fetchLeaves();
          }
      }, [activeTab, students.length]);

      // ===== MARK ATTENDANCE =====
      const handleMarkAttendanceSubmit = async (e) => {
          e.preventDefault();
          if (students.length === 0) {
              showMessage('No students to mark attendance for', 'error');
              return;
          }
          setLoading(true);
          try {
              const payload = {
                  subject: markForm.subject,
                  date: markForm.date,
                  students: students.map(s => ({
                      studentId: s.id,
                      status: markForm.statuses[s.id] || 'PRESENT'
                  }))
              };
              const res = await api.post('/attendance/mark', payload);
              if (res.status === 200 || res.status === 201) {
                  showMessage(`✅ Attendance marked for ${students.length} students`, 'success');
              }
          } catch (err) {
              const status = err.response?.status;
              const msg = err.response?.data?.error || err.response?.data?.message || err.message || 'Failed to mark attendance';
              if (status === 400 && msg.toLowerCase().includes('already marked')) {
                  showMessage('ℹ️ Attendance already marked for today', 'success');
              } else {
                  showMessage('❌ ' + msg, 'error');
              }
              console.error('Mark attendance error:', err.response?.data || err);
          } finally {
              setLoading(false);
          }
      };

      const setStudentStatus = (studentId, status) => {
          setMarkForm(prev => ({ ...prev, statuses: { ...prev.statuses, [studentId]: status } }));
      };

      // ===== LIBRARY =====
      const handleAddBook = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
              const res = await api.post('/library/books', bookForm);
              if (res.status === 200 || res.status === 201) {
                  showMessage('✅ Book added!', 'success');
                  setShowAddBookModal(false);
                  setBookForm({ title: '', author: '', isbn: '', category: 'Textbook', location: '', totalCopies: 1, availableCopies: 1 });
                  fetchBooks();
              }
          } catch (err) {
              showMessage('❌ Failed to add book', 'error');
          } finally {
              setLoading(false);
          }
      };

      const handleDeleteBook = async (id) => {
          if (!confirm('Delete this book?')) return;
          try {
              await api.delete(`/library/books/${id}`);
              showMessage('✅ Book deleted', 'success');
              fetchBooks();
          } catch (err) {
              showMessage('❌ Failed to delete', 'error');
          }
      };

      // ===== ASSIGNMENTS =====
      const handleCreateAssignment = async (e) => {
          e.preventDefault();
          if (!assignmentForm.title.trim() || !assignmentForm.deadline) {
              showMessage('Title and deadline are required', 'error');
              return;
          }
          setLoading(true);
          try {
              const assignmentJson = {
                  title: assignmentForm.title.trim(),
                  description: assignmentForm.description.trim() || '',
                  subject: assignmentForm.subject,
                  deadline: assignmentForm.deadline,
                  maxScore: assignmentForm.maxScore,
                  submissions: 0,
                  graded: 0
              };

              const fd = new FormData();
              fd.append(
                  'assignment',
                  new Blob([JSON.stringify(assignmentJson)], { type: 'application/json' })
              );
              if (assignmentForm.questionFile) {
                  fd.append('file', assignmentForm.questionFile, assignmentForm.questionFile.name);
              }

              const res = await api.post('/assignments', fd, {
                  headers: { 'Content-Type': 'multipart/form-data' }
              });

              if (res.status === 201 || res.status === 200) {
                  showMessage('✅ Assignment created!', 'success');
                  setShowCreateAssignmentModal(false);
                  setAssignmentForm({
                      title: '', description: '', subject: 'DBMS',
                      deadline: '', maxScore: 10, questionFile: null
                  });
                  await fetchAssignments();
              }
          } catch (err) {
              const msg = err.response?.data?.error
                  || err.response?.data?.message
                  || err.message
                  || 'Failed to create assignment';
              showMessage('❌ ' + msg, 'error');
              console.error('Create assignment error:', err.response?.data || err);
          } finally {
              setLoading(false);
          }
      };

      const handleDeleteAssignment = async (id) => {
          if (!confirm('Delete this assignment?')) return;
          try {
              await api.delete(`/assignments/${id}`);
              showMessage('✅ Assignment deleted', 'success');
              await fetchAssignments();
          } catch (err) {
              showMessage('❌ Failed to delete assignment', 'error');
          }
      };

      // ===== COURSE MATERIALS =====
      const fetchCourseMaterials = async () => {
          try {
              const res = await api.get('/course-material/all');
              setCourseMaterials(Array.isArray(res.data) ? res.data : []);
          } catch (err) { setCourseMaterials([]); }
      };

      const fetchMySubjects = async () => {
          try {
              const res = await api.get('/course-material/my-subjects');
              if (Array.isArray(res.data) && res.data.length > 0) {
                  setMySubjects(res.data);
                  setMaterialForm(prev => ({ ...prev, subject: prev.subject || res.data[0] }));
              } else {
                  const globalRes = await api.get('/course-material/subjects');
                  if (Array.isArray(globalRes.data)) {
                      setMySubjects(globalRes.data);
                      if (globalRes.data.length > 0) setMaterialForm(prev => ({ ...prev, subject: prev.subject || globalRes.data[0] }));
                  }
              }
          } catch (err) { setMySubjects(['DBMS', 'OS', 'CN', 'DSA', 'AI', 'ML']); }
      };

      const handleUploadMaterialFileChange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          if (f.size > 50 * 1024 * 1024) { showMessage('File too large (max 50MB)', 'error'); e.target.value = ''; return; }
          setMaterialForm(prev => ({ ...prev, file: f }));
      };

      // Handler for assignment PDF upload
      const handleAssignmentFileChange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          if (f.size > 50 * 1024 * 1024) { showMessage('File too large (max 50MB)', 'error'); e.target.value = ''; return; }
          if (f.type !== 'application/pdf') { showMessage('Only PDF files are allowed', 'error'); e.target.value = ''; return; }
          setAssignmentForm(prev => ({ ...prev, questionFile: f }));
      };

      const resetMaterialForm = () => {
          setMaterialForm({ title: '', description: '', subject: mySubjects[0] || '', type: 'NOTES', uploadMode: 'FILE', file: null, videoUrl: '', playlistUrl: '' });
      };

      const handleUploadMaterial = async (e) => {
          e.preventDefault();
          if (!materialForm.title.trim()) { showMessage('Title is required', 'error'); return; }
          if (!materialForm.subject.trim()) { showMessage('Subject is required', 'error'); return; }
          if (materialForm.uploadMode === 'FILE' && !materialForm.file) { showMessage('Please choose a file', 'error'); return; }
          if (materialForm.uploadMode === 'VIDEO' && !materialForm.videoUrl.trim()) { showMessage('Enter a video URL', 'error'); return; }
          if (materialForm.uploadMode === 'PLAYLIST' && !materialForm.playlistUrl.trim()) { showMessage('Enter a playlist URL', 'error'); return; }

          setLoading(true);
          try {
              const fd = new FormData();
              const materialJson = {
                  title: materialForm.title.trim(),
                  description: materialForm.description.trim() || null,
                  subject: materialForm.subject.trim(),
                  type: materialForm.type,
                  videoUrl: materialForm.uploadMode === 'VIDEO' ? materialForm.videoUrl.trim() : null,
                  playlistUrl: materialForm.uploadMode === 'PLAYLIST' ? materialForm.playlistUrl.trim() : null
              };
              fd.append('material', new Blob([JSON.stringify(materialJson)], { type: 'application/json' }));
              if (materialForm.uploadMode === 'FILE' && materialForm.file) fd.append('file', materialForm.file, materialForm.file.name);
              const res = await api.post('/course-material/upload', fd, { headers: { 'Content-Type': 'multipart/form-data' } });
              if (res.status === 201 || res.status === 200) {
                  showMessage('✅ Material uploaded!', 'success');
                  setShowUploadMaterialModal(false);
                  resetMaterialForm();
                  fetchCourseMaterials();
              }
          } catch (err) {
              const msg = err.response?.data?.error || err.response?.data?.message || err.message || 'Upload failed';
              showMessage('❌ ' + msg, 'error');
          } finally {
              setLoading(false);
          }
      };

      const handleDeleteMaterial = async (material) => {
          if (!confirm(`Delete "${material.title}"?`)) return;
          try {
              await api.delete(`/course-material/${material.id}`);
              showMessage('✅ Material deleted', 'success');
              fetchCourseMaterials();
          } catch (err) { showMessage('❌ Failed to delete', 'error'); }
      };

      const getMaterialTypeBadge = (type) => {
          const map = {
              'NOTES': 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
              'VIDEO': 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
              'PLAYLIST': 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400',
              'REFERENCE': 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400',
              'ASSIGNMENT': 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400'
          };
          return map[type] || 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300';
      };

      // ===== DASHBOARD =====
      const renderDashboard = () => {
          const todayClasses = timetable.filter(t => t.day === getCurrentDay()).length;
          return (
              <div>
                  <div className="welcome-gradient rounded-2xl p-6 text-white mb-6 shadow-lg relative overflow-hidden">
                      <div className="absolute top-0 right-0 opacity-10 text-8xl">👨‍🏫</div>
                      <div className="relative">
                          <h2 className="text-2xl font-bold">👨‍🏫 Welcome, {name}!</h2>
                          <p className="text-white/80 text-sm">Manage classes, mark attendance, create assignments, and more.</p>
                      </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                      {[
                          { title: 'Students', value: students.length, sub: 'Total enrolled', icon: '👨‍🎓', color: 'purple' },
                          { title: 'Classes', value: todayClasses, sub: `${todayClasses} today`, icon: '📚', color: 'blue' },
                          { title: 'Timetable Slots', value: timetable.length, sub: 'This week', icon: '📅', color: 'green' },
                          { title: 'Library Books', value: books.length, sub: 'Available', icon: '📖', color: 'yellow' }
                      ].map((card) => {
                          const colorMap = { purple: 'border-purple-500', blue: 'border-blue-500', green: 'border-green-500', yellow: 'border-yellow-500' };
                          return (
                              <div key={card.title} className={`stat-card border-l-4 ${colorMap[card.color]}`}>
                                  <div className="flex items-center justify-between">
                                      <div>
                                          <p className="stat-label">{card.title}</p>
                                          <p className="stat-value">{card.value}</p>
                                          <p className="stat-sub">{card.sub}</p>
                                      </div>
                                      <div className="text-3xl opacity-60">{card.icon}</div>
                                  </div>
                              </div>
                          );
                      })}
                  </div>
              </div>
          );
      };

      // ===== MARK ATTENDANCE =====
      const renderMarkAttendance = () => (
          <div>
              <div className="welcome-gradient rounded-2xl p-6 text-white mb-6 shadow-lg">
                  <h2 className="text-2xl font-bold">📝 Mark Attendance</h2>
                  <p className="text-white/80 text-sm">Select subject and date, then mark each student</p>
              </div>

              {message.text && (
                  <div className={`mb-4 p-3 rounded-lg border-l-4 ${message.type === 'success' ? 'bg-green-100 dark:bg-green-900/30 border-green-500 text-green-700 dark:text-green-400' : 'bg-red-100 dark:bg-red-900/30 border-red-500 text-red-700 dark:text-red-400'}`}>
                      {message.text}
                  </div>
              )}

              <div className="card-modern">
                  <form onSubmit={handleMarkAttendanceSubmit}>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                          <div>
                              <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Subject</label>
                              <select
                                  className="input-field"
                                  value={markForm.subject}
                                  onChange={(e) => setMarkForm({ ...markForm, subject: e.target.value })}
                              >
                                  {ALL_SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                              </select>
                          </div>
                          <div>
                              <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Date</label>
                              <input
                                  type="date"
                                  className="input-field"
                                  value={markForm.date}
                                  onChange={(e) => setMarkForm({ ...markForm, date: e.target.value })}
                              />
                          </div>
                      </div>
                      <div className="overflow-x-auto">
                          <table className="w-full">
                              <thead>
                                  <tr className="border-b dark:border-gray-700">
                                      <th className="px-4 py-2 text-left text-sm font-semibold">Login ID</th>
                                      <th className="px-4 py-2 text-left text-sm font-semibold">Name</th>
                                      <th className="px-4 py-2 text-left text-sm font-semibold">Status</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  {students.length === 0 ? (
                                      <tr><td colSpan="3" className="text-center py-4 text-gray-500">Loading students…</td></tr>
                                  ) : students.map((student) => (
                                      <tr key={student.id} className="border-t dark:border-gray-700">
                                          <td className="px-4 py-2">{student.loginId}</td>
                                          <td className="px-4 py-2">{student.name}</td>
                                          <td className="px-4 py-2">
                                              <div className="flex gap-2">
                                                  <button
                                                      type="button"
                                                      onClick={() => setStudentStatus(student.id, 'PRESENT')}
                                                      className={`px-3 py-1 rounded-lg text-sm font-semibold ${markForm.statuses[student.id] === 'PRESENT' ? 'bg-green-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}
                                                  >✅ Present</button>
                                                  <button
                                                      type="button"
                                                      onClick={() => setStudentStatus(student.id, 'ABSENT')}
                                                      className={`px-3 py-1 rounded-lg text-sm font-semibold ${markForm.statuses[student.id] === 'ABSENT' ? 'bg-red-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}
                                                  >❌ Absent</button>
                                              </div>
                                          </td>
                                      </tr>
                                  ))}
                              </tbody>
                          </table>
                      </div>
                      <button type="submit" disabled={loading || students.length === 0} className="mt-4 btn-primary w-full py-2">
                          {loading ? 'Submitting…' : '✅ Submit Attendance'}
                      </button>
                  </form>
              </div>
          </div>
      );

      // ===== TIMETABLE =====
      const renderTimetable = () => (
          <div>
              <div className="welcome-gradient rounded-2xl p-6 text-white mb-6 shadow-lg">
                  <h2 className="text-2xl font-bold">📅 Timetable</h2>
                  <p className="text-white/80 text-sm">Your weekly schedule</p>
              </div>
              <div className="space-y-4">
                  {['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'].map(day => {
                      const daySlots = timetable.filter(slot => (slot.day || slot.dayOfWeek || '').toUpperCase() === day);
                      return (
                          <div key={day} className="day-card">
                              <div className="day-header">
                                  <span>{day.charAt(0) + day.slice(1).toLowerCase()}</span>
                                  <span className="text-sm font-normal text-gray-500 dark:text-gray-400">{daySlots.length} classes</span>
                              </div>
                              {daySlots.length > 0 ? daySlots.map((slot, i) => (
                                  <div key={i} className="day-slot">
                                      <div className="day-slot-left">
                                          <span className="day-slot-subject">{slot.subject}</span>
                                          <span className="day-slot-detail">• {slot.period || slot.timeSlot}</span>
                                          <span className="day-slot-block">🏢 {slot.block || slot.room || 'Block 1'}</span>
                                      </div>
                                  </div>
                              )) : <div className="day-empty">No classes</div>}
                          </div>
                      );
                  })}
              </div>
          </div>
      );

      // ===== LIBRARY =====
      const renderLibrary = () => (
          <div>
              <div className="welcome-gradient rounded-2xl p-6 text-white mb-6 shadow-lg">
                  <div className="flex justify-between items-center flex-wrap gap-3">
                      <div>
                          <h2 className="text-2xl font-bold">📖 Library</h2>
                          <p className="text-white/80 text-sm">Manage books</p>
                      </div>
                      <button onClick={() => setShowAddBookModal(true)} className="btn-primary bg-white/20 hover:bg-white/30 text-white border border-white/30">
                          ＋ Add Book
                      </button>
                  </div>
              </div>

              {message.text && (
                  <div className={`mb-4 p-3 rounded-lg border-l-4 ${message.type === 'success' ? 'bg-green-100 dark:bg-green-900/30 border-green-500 text-green-700 dark:text-green-400' : 'bg-red-100 dark:bg-red-900/30 border-red-500 text-red-700 dark:text-red-400'}`}>
                      {message.text}
                  </div>
              )}

              {books.length === 0 ? (
                  <div className="card-modern text-center py-8 text-gray-500">No books</div>
              ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {books.map(book => {
                          const status = book.availableCopies > 0 ? 'Available' : 'Not Available';
                          return (
                              <div key={book.id} className="card-modern">
                                  <div className="flex gap-4">
                                      <div className="book-cover flex-shrink-0">📚</div>
                                      <div className="flex-1">
                                          <h3 className="font-bold text-gray-800 dark:text-white truncate">{book.title}</h3>
                                          <p className="text-sm text-gray-600 dark:text-gray-400">by {book.author}</p>
                                          {book.isbn && <p className="text-xs text-gray-500 mt-1">ISBN: {book.isbn}</p>}
                                          <div className="flex flex-wrap gap-2 mt-2">
                                              {book.category && <span className="badge badge-available">{book.category}</span>}
                                              <span className={`badge ${book.availableCopies > 0 ? 'badge-available' : 'badge-borrowed'}`}>{status}</span>
                                              <span className="text-xs text-gray-500 dark:text-gray-400">{book.availableCopies}/{book.totalCopies}</span>
                                          </div>
                                          <button onClick={() => handleDeleteBook(book.id)} className="btn-danger text-sm py-1 px-2 mt-2">🗑️ Delete</button>
                                      </div>
                                  </div>
                              </div>
                          );
                      })}
                  </div>
              )}

              {showAddBookModal && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                      <div className="modal-content max-w-lg">
                          <div className="flex justify-between items-center mb-4">
                              <h2 className="text-xl font-bold text-gray-800 dark:text-white">📚 Add Book</h2>
                              <button onClick={() => setShowAddBookModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                          </div>
                          <form onSubmit={handleAddBook}>
                              <div className="mb-3">
                                  <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Title *</label>
                                  <input type="text" value={bookForm.title} onChange={(e) => setBookForm({ ...bookForm, title: e.target.value })} className="input-field" required />
                              </div>
                              <div className="mb-3">
                                  <label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Author *</label>
                                  <input type="text" value={bookForm.author} onChange={(e) => setBookForm({ ...bookForm, author: e.target.value })} className="input-field" required />

                                      const color =
                                          pct >= 75 ? 'text-green-600 dark:text-green-400'
                                          : pct >= 50 ? 'text-yellow-600 dark:text-yellow-400'
                                          : 'text-red-600 dark:text-red-400';
                                      return (
                                          <tr key={s.studentId} className="border-t dark:border-gray-700">
                                              <td className="px-4 py-3 text-gray-800 dark:text-white">{s.loginId}</td>
                                              <td className="px-4 py-3 text-gray-800 dark:text-white">{s.name}</td>
                                              <td className="px-4 py-3 text-gray-600 dark:text-gray-300">{s.present}</td>
                                              <td className="px-4 py-3 text-gray-600 dark:text-gray-300">{s.total}</td>
                                              <td className={`px-4 py-3 font-bold ${color}`}>{pct}%</td>
                                          </tr>
                                      );
                                  })}
                              </tbody>
                          </table>
                      </div>
                  )}
              </div>
          </div>
      );

      // ===== SWITCHER =====
      const renderContent = () => {
          switch (activeTab) {
              case 'dashboard': return renderDashboard();
              case 'markattendance': return renderMarkAttendance();
              case 'attendance': return renderAttendance();
              case 'timetable': return renderTimetable();
              case 'noticeboard': return renderNoticeBoard();
              case 'assignments': return renderAssignments();
              case 'courseMaterials': return renderCourseMaterials();
              case 'leaves': return renderLeaveManagement();
              case 'library': return renderLibrary();
              case 'feedback': return renderFeedback();
              case 'cafeteria': window.location.href = 'cafeteria-dashboard.html'; return null;
              case 'chatbot': window.location.href = 'chatbot.html'; return null;
              case 'campus': window.location.href = 'campus-view.html'; return null;
              default: return renderDashboard();
          }
      };

      const navItems = [
          { id: 'dashboard', icon: '📊', label: 'Dashboard' },
          { id: 'markattendance', icon: '📝', label: 'Mark Attendance' },
          { id: 'attendance', icon: '📈', label: 'Attendance' },
          { id: 'timetable', icon: '📅', label: 'Timetable' },
          { id: 'noticeboard', icon: '📋', label: 'Notice Board' },
          { id: 'assignments', icon: '📝', label: 'Assignments' },
          { id: 'courseMaterials', icon: '📚', label: 'Course Materials' },
          { id: 'leaves', icon: '📋', label: 'Leave Management' },
          { id: 'library', icon: '📖', label: 'Library' },
          { id: 'feedback', icon: '📝', label: 'Feedback' },
          { id: 'cafeteria', icon: '🍽️', label: 'Cafeteria' },
          { id: 'chatbot', icon: '🤖', label: 'Chat Assistant' },
          { id: 'campus', icon: '🌍', label: 'Campus View' }
      ];

      return (
          <div className={`${isDarkMode ? 'dark' : ''}`}>
              <button className="sidebar-toggle-mobile" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>☰</button>
              <div className={`sidebar-overlay ${isSidebarOpen ? 'active' : ''}`} onClick={() => setIsSidebarOpen(false)} />
              <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${isSidebarOpen ? 'open' : ''}`}>
                  <div className="sidebar-header">
                      <span className="logo-text">👨‍🏫 Faculty</span>
                      <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>
                          {isSidebarCollapsed ? '☰' : '◀'}
                      </button>
                  </div>
                  <div className="sidebar-menu">
                      <div className="sidebar-menu-title">Main</div>
                      {navItems.map(item => (
                          <button
                              key={item.id}
                              className={`sidebar-item ${activeTab === item.id ? 'active' : ''}`}
                              onClick={() => {
                                  if (item.id === 'chatbot' || item.id === 'cafeteria' || item.id === 'campus') {
                                      window.location.href = item.id === 'chatbot' ? 'chatbot.html' : item.id === 'cafeteria' ? 'cafeteria-dashboard.html' : 'campus-view.html';
                                  } else {
                                      setActiveTab(item.id);
                                      setIsSidebarOpen(false);
                                  }
                              }}
                          >
                              <span className="icon">{item.icon}</span>
                              <span className="sidebar-label">{item.label}</span>
                          </button>
                      ))}
                  </div>
                  <div className="sidebar-footer">
                      <div className="sidebar-user">
                          <div className="sidebar-user-avatar">{name.charAt(0).toUpperCase()}</div>
                          <div className="sidebar-user-info">
                              <div className="sidebar-user-name">{name}</div>
                              <div className="sidebar-user-role">Faculty</div>
                          </div>
                      </div>
                      <button className="sidebar-logout" onClick={handleLogout}><span className="icon">🚪</span><span className="sidebar-logout-text">Logout</span></button>
                      <button className="sidebar-logout mt-1" onClick={toggleTheme}><span className="icon">{isDarkMode ? '☀️' : '🌙'}</span><span className="sidebar-logout-text">{isDarkMode ? 'Light' : 'Dark'}</span></button>
                  </div>
              </div>
              <div className="main-content">
                  {renderContent()}
              </div>
          </div>
      );
  }

  ReactDOM.render(<FacultyDashboard />, document.getElementById('root'));
</script>
</body>
</html>
