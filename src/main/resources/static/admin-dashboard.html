        /* ============================================

        .stat-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 22px 24px;
            border: 1px solid rgba(226,232,240,0.8);
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);

                'PERIOD_6': { start: '15:00', end: '16:00' }
            };
            const times = periodTimes[period];
            if (!times) return 'upcoming';
            if (day !== currentDay) {
                const dayOrder = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
                const currentDayIndex = dayOrder.indexOf(currentDay);
                const slotDayIndex = dayOrder.indexOf(day);
                if (slotDayIndex < currentDayIndex) return 'completed';
                if (slotDayIndex > currentDayIndex) return 'upcoming';
            }
            if (currentTime < times.start) return 'upcoming';
            if (currentTime >= times.start && currentTime <= times.end) return 'ongoing';
            return 'completed';
        };

            const days = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

            const todayDay = today.getDay();
            const dayIndex = days.indexOf(day);
            if (dayIndex === -1) return '';
            const diff = dayIndex - (todayDay === 0 ? 6 : todayDay - 1);
            const date = new Date(today);
            date.setDate(date.getDate() + diff);
            return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

                                    <tbody>
                                        {allBookings.map(booking => (
                                            <tr key={booking.id} className="border-t table-border row-hover cursor-pointer" onClick={() => { setSelectedBooking(booking); setShowBookingDetailModal(true); }}>
                                                <td className="px-4 py-3"><div><p className="font-medium text-gray-800 dark:text-white">{booking.userName}</p><div className="flex items-center gap-2"><span className="text-xs text-gray-500 dark:text-gray-400">{booking.userLoginId}</span><span className={getUserRoleBadge(booking.userRole)}>{booking.userRole === 'FACULTY' ? '👨‍🏫 Faculty' : '👨‍🎓 Student'}</span></div></div></td>
                                                <td className="px-4 py-3 font-mono text-blue-600 dark:text-blue-400">{booking.busNumber}</td>
                                                <td className="px-4 py-3 font-bold text-gray-800 dark:text-white">{booking.seatNumber}</td>
                                                <td className="px-4 py-3 text-sm text-gray-600 dark:text-gray-300">{booking.routeName}</td>
                                                <td className="px-4 py-3"><span className={`badge ${getBookingStatusBadge(booking.bookingStatus)}`}>{booking.bookingStatusDisplay || booking.bookingStatus}</span></td>
                                                <td className="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">{booking.bookingDate ? new Date(booking.bookingDate).toLocaleDateString() : 'N/A'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                    <div className="card-modern mb-6">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <h3 className="text-xl font-bold text-gray-800 dark:text-white">🚌 All Buses</h3>
                            <span className="text-sm text-gray-500 dark:text-gray-400">Total: {buses.length} buses</span>
                        </div>
                        {busLoading ? (
                            <div className="text-center py-8 text-gray-500 dark:text-gray-400">Loading buses...</div>
                        ) : buses.length === 0 ? (
                            <div className="text-center py-8 text-gray-500 dark:text-gray-400"><p className="text-4xl mb-2">🚌</p><p>No buses available</p><button onClick={() => setShowAddBusModal(true)} className="btn-primary mt-3 text-sm py-1 px-4">+ Add Your First Bus</button></div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead className="table-header">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Bus Number</th>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Driver</th>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Phone</th>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Capacity</th>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Status</th>
                                            <th className="px-4 py-3 text-left text-sm font-semibold table-header-text">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {buses.map(bus => (
                                            <tr key={bus.id} className="border-t table-border row-hover">
                                                <td className="px-4 py-3 font-mono text-sm text-blue-600 dark:text-blue-400 font-bold">{bus.busNumber}</td>
                                                <td className="px-4 py-3 table-cell"><div><p className="font-medium text-gray-800 dark:text-white">{bus.driverName}</p><p className="text-xs text-gray-500 dark:text-gray-400">Driver</p></div></td>
                                                <td className="px-4 py-3 table-cell text-sm font-mono">{bus.driverPhone}</td>
                                                <td className="px-4 py-3 table-cell text-sm font-bold text-gray-800 dark:text-white">{bus.capacity}</td>
                                                <td className="px-4 py-3"><span className={`badge ${getStatusBadge(bus.status)}`}>{bus.statusDisplay || bus.status || 'ACTIVE'}</span></td>
                                                <td className="px-4 py-3"><div className="flex gap-2"><button onClick={() => openEditBus(bus)} className="btn-warning text-sm py-1 px-3">✏️</button><button onClick={() => handleDeleteBus(bus.id)} className="btn-danger text-sm py-1 px-3">🗑️</button></div></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                    <div className="card-modern">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <h3 className="text-xl font-bold text-gray-800 dark:text-white">🛣️ City Routes</h3>
                            <div className="flex gap-2"><span className="text-sm text-gray-500 dark:text-gray-400">Total: {busRoutes.length} routes</span></div>
                        </div>
                        {busRoutes.length === 0 ? (
                            <div className="text-center py-4 text-gray-500 dark:text-gray-400"><p className="text-4xl mb-2">🛣️</p><p>No routes defined</p><button onClick={() => setShowAddRouteModal(true)} className="btn-primary mt-3 text-sm py-1 px-4">+ Add Your First Route</button></div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {busRoutes.map(route => {
                                    let stopsList = route.stops;
                                    if (typeof stopsList === 'string') stopsList = stopsList.split(',').map(s => s.trim());
                                    const stopsDisplay = Array.isArray(stopsList) ? stopsList.join(' → ') : stopsList || 'No stops listed';
                                    return (
                                        <div key={route.id} className="border border-gray-200 dark:border-gray-700 rounded-lg p-4 hover:shadow-md transition">
                                            <div className="flex justify-between items-start">
                                                <h4 className="font-bold text-gray-800 dark:text-white">{route.routeName}</h4>
                                                <span className={`text-xs px-2 py-1 rounded-full ${route.isActive ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}`}>{route.isActive ? 'Active' : 'Inactive'}</span>
                                            </div>
                                            <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">{route.description}</p>
                                            <div className="flex flex-wrap gap-2 mt-2 text-xs">
                                                <span className={`badge ${route.routeType === 'CAMPUS' ? 'route-badge-campus' : 'route-badge-city'}`}>{route.routeType || 'CITY'}</span>
                                                <span className="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 px-2 py-0.5 rounded-full">{route.startLocation} → {route.endLocation}</span>
                                                <span className="bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 px-2 py-0.5 rounded-full">{route.totalDistanceKm} km</span>
                                            </div>
                                            <div className="mt-2 text-xs text-gray-500 dark:text-gray-400"><span className="font-semibold">Stops:</span> {stopsDisplay}</div>
                                            <div className="mt-3 flex gap-2"><button className="btn-warning text-sm py-1 px-3">✏️ Edit</button><button onClick={() => handleDeleteRoute(route.id)} className="btn-danger text-sm py-1 px-3">🗑️ Delete</button></div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    {showAddRouteModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-lg">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">🛣️ Add New Route</h2>
                                    <button onClick={() => setShowAddRouteModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                                </div>
                                <form onSubmit={handleAddRoute}>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Route Name *</label><input type="text" value={routeForm.routeName} onChange={(e) => setRouteForm({...routeForm, routeName: e.target.value})} className="input-field" placeholder="e.g., College to Sector 62" required /><p className="text-xs text-gray-500 mt-1">Example: College to Sector 62, Sector 143 to College</p></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Description</label><textarea value={routeForm.description} onChange={(e) => setRouteForm({...routeForm, description: e.target.value})} rows="2" className="input-field" placeholder="Route description..." /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Start Location *</label><input type="text" value={routeForm.startLocation} onChange={(e) => setRouteForm({...routeForm, startLocation: e.target.value})} className="input-field" placeholder="College Main Gate" required /></div>
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">End Location *</label><input type="text" value={routeForm.endLocation} onChange={(e) => setRouteForm({...routeForm, endLocation: e.target.value})} className="input-field" placeholder="Sector 62" required /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Route Type</label><select value={routeForm.routeType} onChange={(e) => setRouteForm({...routeForm, routeType: e.target.value})} className="input-field"><option value="CITY">City (Sector to College)</option><option value="CAMPUS">Campus (Within Campus)</option></select></div>
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Status</label><select value={routeForm.isActive ? 'active' : 'inactive'} onChange={(e) => setRouteForm({...routeForm, isActive: e.target.value === 'active'})} className="input-field"><option value="active">✅ Active</option><option value="inactive">❌ Inactive</option></select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Total Distance (km)</label><input type="number" value={routeForm.totalDistanceKm} onChange={(e) => setRouteForm({...routeForm, totalDistanceKm: e.target.value})} className="input-field" placeholder="8.5" step="0.1" min="0" /></div>
                                        <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Est. Duration (min)</label><input type="number" value={routeForm.estimatedDurationMinutes} onChange={(e) => setRouteForm({...routeForm, estimatedDurationMinutes: e.target.value})} className="input-field" placeholder="20" min="1" /></div>
                                    </div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Stops (comma separated)</label><input type="text" value={routeForm.stops} onChange={(e) => setRouteForm({...routeForm, stops: e.target.value})} className="input-field" placeholder="College Main Gate, Sector 59, Sector 60, Sector 61, Sector 62" /><p className="text-xs text-gray-500 mt-1">Enter stops in order, separated by commas</p></div>
                                    <button type="submit" disabled={loading} className="w-full btn-primary py-2">{loading ? '⏳ Creating...' : '🛣️ Create Route'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    {showAddBusModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-md">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">➕ Add New Bus</h2>
                                    <button onClick={() => setShowAddBusModal(false)} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                                </div>
                                <form onSubmit={handleAddBus}>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Bus Number *</label><input type="text" value={busForm.busNumber} onChange={(e) => setBusForm({...busForm, busNumber: e.target.value})} className="input-field" placeholder="UP-32-DX-0596" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Driver Name *</label><input type="text" value={busForm.driverName} onChange={(e) => setBusForm({...busForm, driverName: e.target.value})} className="input-field" placeholder="Rajesh Kumar" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Driver Phone *</label><input type="tel" value={busForm.driverPhone} onChange={(e) => setBusForm({...busForm, driverPhone: e.target.value})} className="input-field" placeholder="9876543210" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Capacity (Seats) *</label><input type="number" value={busForm.capacity} onChange={(e) => setBusForm({...busForm, capacity: e.target.value})} className="input-field" placeholder="40" min="1" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Registration Number *</label><input type="text" value={busForm.registrationNumber} onChange={(e) => setBusForm({...busForm, registrationNumber: e.target.value})} className="input-field" placeholder="UP-32-DX-0596" required /></div>
                                    <button type="submit" disabled={busLoading} className="w-full btn-primary py-2">{busLoading ? '⏳ Adding...' : '🚌 Add Bus'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    {showEditBusModal && editingBus && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-md">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">✏️ Edit Bus</h2>
                                    <button onClick={() => { setShowEditBusModal(false); setEditingBus(null); }} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                                </div>
                                <form onSubmit={handleEditBus}>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Bus Number</label><input type="text" value={busForm.busNumber} className="input-field" disabled /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Driver Name *</label><input type="text" value={busForm.driverName} onChange={(e) => setBusForm({...busForm, driverName: e.target.value})} className="input-field" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Driver Phone *</label><input type="tel" value={busForm.driverPhone} onChange={(e) => setBusForm({...busForm, driverPhone: e.target.value})} className="input-field" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Capacity (Seats) *</label><input type="number" value={busForm.capacity} onChange={(e) => setBusForm({...busForm, capacity: e.target.value})} className="input-field" min="1" required /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Registration Number</label><input type="text" value={busForm.registrationNumber} onChange={(e) => setBusForm({...busForm, registrationNumber: e.target.value})} className="input-field" /></div>
                                    <div className="mb-3"><label className="block text-gray-700 dark:text-gray-300 font-bold mb-1">Status</label><select value={busForm.status} onChange={(e) => setBusForm({...busForm, status: e.target.value})} className="input-field"><option value="ACTIVE">✅ Active</option><option value="INACTIVE">❌ Inactive</option><option value="MAINTENANCE">🔧 Under Maintenance</option></select></div>
                                    <button type="submit" disabled={busLoading} className="w-full btn-primary py-2">{busLoading ? '⏳ Saving...' : '💾 Update Bus'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    {showBookingDetailModal && selectedBooking && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
                            <div className="modal-content max-w-lg">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white">🎫 Booking Details</h2>
                                    <button onClick={() => { setShowBookingDetailModal(false); setSelectedBooking(null); }} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                                </div>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">User</p><p className="font-semibold text-gray-800 dark:text-white">{selectedBooking.userName}</p><p className="text-xs text-gray-500 dark:text-gray-400">{selectedBooking.userLoginId}</p></div>
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">Role</p><span className={getUserRoleBadge(selectedBooking.userRole)}>{selectedBooking.userRole === 'FACULTY' ? '👨‍🏫 Faculty' : '👨‍🎓 Student'}</span></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">Bus Number</p><p className="font-semibold text-blue-600 dark:text-blue-400">{selectedBooking.busNumber}</p></div>
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">Seat Number</p><p className="font-bold text-gray-800 dark:text-white">{selectedBooking.seatNumber}</p></div>
                                    </div>
                                    <div><p className="text-sm text-gray-500 dark:text-gray-400">Route</p><p className="font-semibold text-gray-800 dark:text-white">{selectedBooking.routeName}</p></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">Booking Status</p><span className={`badge ${getBookingStatusBadge(selectedBooking.bookingStatus)}`}>{selectedBooking.bookingStatusDisplay || selectedBooking.bookingStatus}</span></div>
                                        <div><p className="text-sm text-gray-500 dark:text-gray-400">Booking Date</p><p className="text-gray-800 dark:text-white">{selectedBooking.bookingDate ? new Date(selectedBooking.bookingDate).toLocaleString() : 'N/A'}</p></div>
                                    </div>
                                    {selectedBooking.cancellationReason && (<div><p className="text-sm text-gray-500 dark:text-gray-400">Cancellation Reason</p><p className="text-red-600 dark:text-red-400">{selectedBooking.cancellationReason}</p></div>)}
                                    <button onClick={() => { setShowBookingDetailModal(false); setSelectedBooking(null); }} className="w-full btn-primary py-2">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const renderContent = () => {
            switch(activeTab) {
                case 'dashboard': return renderDashboard();
                case 'attendance': return renderAttendance();
                case 'timetable': return renderTimetableView();
                case 'users': return renderUsers();
                case 'managetimetable': return renderManageTimetable();
                case 'complaints': return renderComplaints();
                case 'noticeboard': return renderNoticeBoard();
                case 'library': return renderLibrary();
                case 'clubs': return renderClubs();
                case 'events': return renderEvents();
                case 'cafeteria': return renderCafeteriaAdmin();
                case 'leaves': return renderLeaveManagement();
                case 'transport': return renderTransportManagement();
                case 'feedback': return renderFeedback();
                case 'hostel': window.location.href = 'hostel.html'; return null;
                case 'placement': window.location.href = 'placement.html'; return null;
                case 'chatbot': window.location.href = 'chatbot.html'; return null;
                case 'campus': window.location.href = 'campus-view.html'; return null;
                default: return renderDashboard();
            }
        };

        const menuItems = [
            { id: 'dashboard', icon: '📊', label: 'Dashboard' },
            { id: 'attendance', icon: '📈', label: 'Attendance' },
            { id: 'timetable', icon: '📅', label: 'Timetable' },
            { id: 'users', icon: '👥', label: 'Users' },
            { id: 'managetimetable', icon: '📅', label: 'Manage Timetable' },
            { id: 'noticeboard', icon: '📋', label: 'Notice Board' },
            { id: 'library', icon: '📖', label: 'Library' },
            { id: 'complaints', icon: '📋', label: 'Complaints' },
            { id: 'clubs', icon: '🏛️', label: 'Clubs' },
            { id: 'events', icon: '📅', label: 'Events' },
            { id: 'cafeteria', icon: '🍽️', label: 'Cafeteria' },
            { id: 'leaves', icon: '📋', label: 'Leave Management' },
            { id: 'transport', icon: '🚌', label: 'Transport' },
            { id: 'feedback', icon: '📝', label: 'Feedback' },
            { id: 'hostel', icon: '🏠', label: 'Hostel' },
            { id: 'placement', icon: '💼', label: 'Placement' },
            { id: 'chatbot', icon: '🤖', label: 'Chat Assistant' },
            { id: 'campus', icon: '🌍', label: 'Campus View' }
        ];

        return (
            <div className={`${isDarkMode ? 'dark' : ''}`}>
                <button className="sidebar-toggle-mobile" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>☰</button>
                <div className={`sidebar-overlay ${isSidebarOpen ? 'active' : ''}`} onClick={() => setIsSidebarOpen(false)} />
                <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${isSidebarOpen ? 'open' : ''}`}>
                    <div className="sidebar-header">
                        <span className="logo-text">👨‍💼 Admin</span>
                        <button className="sidebar-toggle-btn" onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}>{isSidebarCollapsed ? '☰' : '◀'}</button>
                    </div>
                    <div className="sidebar-menu">
                        <div className="sidebar-menu-title">Main</div>
                        {menuItems.map(item => (
                            <button key={item.id} className={`sidebar-item ${activeTab === item.id ? 'active' : ''}`} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); }}>
                                <span className="icon">{item.icon}</span>
                                <span className="sidebar-label">{item.label}</span>
                            </button>
                        ))}
                    </div>
                    <div className="sidebar-footer">
                        <div className="sidebar-user">
                            <div className="sidebar-user-avatar">{name.charAt(0).toUpperCase()}</div>
                            <div className="sidebar-user-info"><div className="sidebar-user-name">{name}</div><div className="sidebar-user-role">Admin</div></div>
                        </div>
                        <button className="sidebar-logout" onClick={handleLogout}><span className="icon">🚪</span><span className="sidebar-logout-text">Logout</span></button>
                        <button className="sidebar-logout mt-1" onClick={toggleTheme}><span className="icon">{isDarkMode ? '☀️' : '🌙'}</span><span className="sidebar-logout-text">{isDarkMode ? 'Light' : 'Dark'}</span></button>
                    </div>
                </div>
                <div className="main-content">{renderContent()}</div>
            </div>
        );
    }

    ReactDOM.render(<AdminDashboard />, document.getElementById('root'));
</script>
</body>
</html>
