# ===============================
# Application Info
# ===============================
spring.application.name=smart-campus-assistant
server.port=8080

# Base URL for QR codes
server.base.url=http://13.200.246.254:8080

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ===============================
# Spring Mail Configuration (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# Spring Boot Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.smartcampus.assistant=DEBUG

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ? Each upload type has its OWN dedicated directory ? do NOT share them
# Course materials (used by CourseMaterialService via app.upload.dir)
app.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/course-materials/
app.event.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/events/
app.lostitem.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/lost-items/
app.placement.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/placement/
app.assignment.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/assignments/
app.leave.upload.dir=C:/Users/shirin sinha/IdeaProjects/smart-campus-assistant/uploads/leaves/

# ===============================
# Jackson Serialization
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent_output=true

# ===============================
# UPI Payment Configuration
# ===============================
upi.merchant.name=Smart Campus Cafeteria
upi.merchant.id=smartcampus@paytm
payment.callback.url=http://13.200.246.254:8080/api/payments/upi/callback
payment.timeout.minutes=15

# ===============================
# Gemini API Configuration (Optional)
# ===============================
gemini.api.key=${GEMINI_API_KEY:}